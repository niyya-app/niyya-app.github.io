const CITADELLE = [{"label": "🍽️ Avant de manger", "items": [{"titre": "Au début du repas", "quand": "Avant de commencer à manger", "ar": "بِسْمِ اللَّهِ", "phon": "Bismi-llâh.", "fr": "Au nom d'Allah.", "src": "Ibn Mâja n° 3264, d'après 'Âïcha — jugé authentique (sahih) par Al-Albani ; l'ordre « Mentionne le nom d'Allah » est aussi chez Al-Boukhari n° 5376", "note": "Formule copiée d'Ibn Mâja (« فَلْيَقُلْ بِسْمِ اللَّهِ » : « qu'il dise : Bismi-llâh »). Dans Al-Boukhari n° 5376, le Prophète ﷺ dit seulement « سَمِّ اللَّهَ » (mentionne le nom d'Allah), sans citer la formule mot à mot."}, {"titre": "Si l'on a oublié au début", "quand": "Si l'on a oublié de dire « Bismi-llâh » au début du repas, on le dit dès qu'on s'en souvient", "ar": "بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ", "phon": "Bismi-llâhi awwalahu wa âkhirah.", "fr": "Au nom d'Allah, au début et à la fin [de ce repas].", "src": "Abou Dawoud n° 3767, d'après 'Âïcha — jugé authentique (sahih) par Al-Albani", "note": "Ibn Mâja n° 3264 (sahih selon Al-Albani) rapporte la variante « بِسْمِ اللَّهِ فِي أَوَّلِهِ وَآخِرِهِ » (Bismi-llâhi fî awwalihi wa âkhirih). At-Tirmidhi n° 1858 n'est pas cité : son texte arabe est absent du fichier source utilisé, donc non vérifié."}, {"titre": "Les bonnes manières à table", "quand": "Conseil du Prophète ﷺ à un enfant ; à enseigner aux enfants", "ar": "سَمِّ اللَّهَ، وَكُلْ بِيَمِينِكَ وَكُلْ مِمَّا يَلِيكَ", "phon": "Sammi-llâha, wa kul bi-yamînika, wa kul mimmâ yalîk.", "fr": "Mentionne le nom d'Allah, mange de ta main droite et mange de ce qui est devant toi.", "src": "Al-Boukhari n° 5376, d'après 'Omar ibn Abî Salama", "note": "Paroles adressées par le Prophète ﷺ à 'Omar ibn Abî Salama, alors enfant élevé dans son foyer, dont la main allait de tous côtés dans le plat. Ce n'est pas une formule à réciter mais une règle de conduite : on dit « Bismi-llâh », on mange de la main droite, et on se sert devant soi."}]}, {"label": "🤲 Après avoir mangé", "items": [{"titre": "Remercier Allah pour la nourriture", "quand": "À la fin du repas", "ar": "الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلاَ قُوَّةٍ", "phon": "Al-hamdu li-llâhi-lladhî at'amanî hâdhâ wa razaqanîhi min ghayri hawlin minnî wa lâ quwwah.", "fr": "Louange à Allah qui m'a donné à manger ceci et me l'a accordé sans force ni pouvoir de ma part.", "src": "At-Tirmidhi n° 3458 et Ibn Mâja n° 3285, d'après Mou'âdh ibn Anas — jugé bon (hasan) par Al-Albani", "note": "Le hadith promet le pardon des péchés passés à qui le dit. Abou Dawoud n° 4023 (hasan selon Al-Albani) a « أَطْعَمَنِي هَذَا الطَّعَامَ » (« ce repas ») ; le texte affiché est celui d'At-Tirmidhi et d'Ibn Mâja, identiques."}, {"titre": "Louange abondante après le repas", "quand": "Quand on débarrasse la table / à la fin du repas", "ar": "الْحَمْدُ لِلَّهِ كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ، غَيْرَ مَكْفِيٍّ، وَلاَ مُوَدَّعٍ وَلاَ مُسْتَغْنًى عَنْهُ، رَبَّنَا", "phon": "Al-hamdu li-llâhi kathîran tayyiban mubârakan fîh, ghayra makfiyyin wa lâ muwadda'in wa lâ mustaghnan 'anhu, rabbanâ.", "fr": "Louange à Allah, une louange abondante, pure et bénie ; [une louange] jamais suffisante, jamais délaissée, et dont on ne saurait se passer, ô notre Seigneur.", "src": "Al-Boukhari n° 5458, d'après Abou Oumâma", "note": "Le texte de Boukhari dit « al-hamdu li-llâhi kathîran » (sans le mot « hamdan »). Le sens de « ghayra makfiyyin » est discuté par les commentateurs (louange jamais suffisante, ou nourriture dont on n'a jamais fini d'avoir besoin) ; la traduction donne le sens le plus courant. Variante dans Al-Boukhari n° 5459 : « الْحَمْدُ لِلَّهِ الَّذِي كَفَانَا وَأَرْوَانَا »."}]}, {"label": "🏡 Famille", "items": [{"titre": "Protéger ses enfants", "quand": "En récitant sur ses enfants (le Prophète ﷺ le faisait pour Al-Hasan et Al-Housayn)", "ar": "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لاَمَّةٍ", "phon": "A'ûdhu bi-kalimâti-llâhi-t-tâmmati min kulli shaytânin wa hâmmah, wa min kulli 'aynin lâmmah.", "fr": "Je cherche refuge dans les paroles parfaites d'Allah contre tout diable et toute créature nuisible, et contre tout mauvais œil.", "src": "Al-Boukhari n° 3371, d'après Ibn 'Abbâs", "note": "Le Prophète ﷺ précise que c'est la protection qu'Abraham faisait pour Ismaël et Isaac. Dans Abou Dawoud n° 4737 et At-Tirmidhi n° 2060 (sahih selon Al-Albani), la formule est adressée directement aux deux enfants : « أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لاَمَّةٍ » (U'îdhukumâ… : « Je vous mets tous deux sous la protection des paroles parfaites d'Allah… »). Pour un seul enfant, on adapte usuellement le pronom (u'îdhuka / u'îdhuki), adaptation qui n'est pas mot à mot dans le texte. « Hâmma » : bête nuisible ou venimeuse."}, {"titre": "Féliciter un nouveau marié", "quand": "À quelqu'un qui vient de se marier", "ar": "بَارَكَ اللَّهُ لَكَ وَبَارَكَ عَلَيْكَ وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ", "phon": "Bâraka-llâhu laka, wa bâraka 'alayka, wa jama'a baynakumâ fî khayr.", "fr": "Qu'Allah te bénisse, qu'Il répande Sa bénédiction sur toi et qu'Il vous unisse tous deux dans le bien.", "src": "Abou Dawoud n° 2130 et At-Tirmidhi n° 1091, d'après Abou Hourayra — jugé authentique (sahih) par Al-Albani", "note": "Le texte est adressé au marié (« laka », « 'alayka » au masculin)."}, {"titre": "Dans l'intimité du couple", "quand": "Pour l'époux, au moment de s'approcher de son épouse", "ar": "بِاسْمِ اللَّهِ، اللَّهُمَّ جَنِّبْنَا الشَّيْطَانَ، وَجَنِّبِ الشَّيْطَانَ مَا رَزَقْتَنَا", "phon": "Bismi-llâh. Allâhumma jannibna-sh-shaytâna wa jannibi-sh-shaytâna mâ razaqtanâ.", "fr": "Au nom d'Allah. Ô Allah, éloigne de nous le diable, et éloigne le diable de ce que Tu nous accorderas [comme enfant].", "src": "Al-Boukhari n° 6388 et Muslim n° 1434, d'après Ibn 'Abbâs", "note": "Le hadith précise que si un enfant leur est destiné de cette union, le diable ne lui nuira jamais. Le texte vise l'époux qui « veut aller vers son épouse »."}, {"titre": "Pour des épouses et une descendance pieuses", "quand": "À tout moment", "ar": "رَبَّنَا هَبْ لَنَا مِنْ أَزْوَٰجِنَا وَذُرِّيَّٰتِنَا قُرَّةَ أَعْيُنٍۢ وَٱجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا", "phon": "Rabbanâ hab lanâ min azwâjinâ wa dhurriyyâtinâ qurrata a'yunin wa-j'alnâ li-l-muttaqîna imâmâ.", "fr": "Seigneur, donne-nous, en nos épouses et nos descendants, la joie des yeux, et fais de nous un guide pour les pieux", "src": "Coran, Le Discernement (Al-Furqân) 25:74 (trad. Hamidullah)", "note": "Invocation que le Coran attribue aux « serviteurs du Tout Miséricordieux ». Seule la partie invoquée est affichée ; le verset complet commence par « Et qui disent : »."}, {"titre": "Pour ses parents", "quand": "À tout moment, pour ses père et mère", "ar": "رَّبِّ ٱرْحَمْهُمَا كَمَا رَبَّيَانِى صَغِيرًۭا", "phon": "Rabbi-rhamhumâ kamâ rabbayânî saghîrâ.", "fr": "O mon Seigneur, fais-leur, à tous deux, miséricorde comme ils m'ont élevé tout petit", "src": "Coran, Le Voyage nocturne (Al-Isrâ') 17:24 (trad. Hamidullah)", "note": "Seule la partie à dire est affichée (le verset commence par l'ordre d'abaisser pour eux l'aile de l'humilité). Le premier « ر » porte une chadda due à la liaison avec le mot précédent « وَقُل » ; seul, on prononce « Rabbi »."}]}, {"label": "☀️ Réveil", "items": [{"titre": "Au réveil", "quand": "Dès le réveil", "ar": "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا، وَإِلَيْهِ النُّشُورُ", "phon": "Al-hamdu li-llâhi-lladhî ahyânâ ba'da mâ amâtanâ wa ilayhi-n-nushûr.", "fr": "Louange à Allah qui nous a rendu la vie après nous avoir fait mourir, et c'est vers Lui que sera la résurrection.", "src": "Al-Boukhari n° 6324, d'après Houdhayfa (aussi n° 6312, 6314, et n° 6325 d'après Abou Dharr)", "note": "Le sommeil est appelé « mort » (mineure) dans ce hadith."}, {"titre": "Au réveil (autre formule)", "quand": "Au réveil", "ar": "الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي فِي جَسَدِي وَرَدَّ عَلَىَّ رُوحِي وَأَذِنَ لِي بِذِكْرِهِ", "phon": "Al-hamdu li-llâhi-lladhî 'âfânî fî jasadî, wa radda 'alayya rûhî, wa adhina lî bi-dhikrih.", "fr": "Louange à Allah qui m'a accordé la santé dans mon corps, m'a rendu mon âme et m'a permis de L'évoquer.", "src": "At-Tirmidhi n° 3401, d'après Abou Hourayra — jugé bon (hasan) par Al-Albani", "note": "Fait partie d'un hadith plus long qui contient aussi une invocation du coucher."}]}, {"label": "🌙 Avant de dormir", "items": [{"titre": "En se couchant", "quand": "Au moment de dormir", "ar": "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", "phon": "Bismika-llâhumma amûtu wa ahyâ.", "fr": "C'est en Ton nom, ô Allah, que je meurs et que je vis.", "src": "Al-Boukhari n° 6324, d'après Houdhayfa", "note": "Dans Al-Boukhari n° 6314, le Prophète ﷺ posait la main sous sa joue en le disant. Le « mourir » désigne ici le sommeil."}, {"titre": "S'en remettre à Allah", "quand": "Couché sur le côté droit ; idéalement ce sont les dernières paroles avant de dormir", "ar": "اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لاَ مَلْجَأَ وَلاَ مَنْجَا مِنْكَ إِلاَّ إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَنَبِيِّكَ الَّذِي أَرْسَلْتَ", "phon": "Allâhumma aslamtu nafsî ilayk, wa wajjahtu wajhî ilayk, wa fawwadtu amrî ilayk, wa alja'tu zhahrî ilayk, raghbatan wa rahbatan ilayk, lâ malja'a wa lâ manjâ minka illâ ilayk, âmantu bi-kitâbika-lladhî anzalt, wa nabiyyika-lladhî arsalt.", "fr": "Ô Allah, je me suis soumis à Toi, j'ai tourné mon visage vers Toi, je T'ai confié mon affaire et je me suis adossé à Toi, par désir de Toi et par crainte de Toi. Il n'y a ni refuge ni salut contre Toi si ce n'est auprès de Toi. J'ai cru en Ton Livre que Tu as révélé et en Ton Prophète que Tu as envoyé.", "src": "Al-Boukhari n° 6315, d'après Al-Barâ' ibn 'Âzib (aussi n° 247, 6311, 6313, 7488 et Muslim n° 2710)", "note": "Le Prophète ﷺ a dit : « Quiconque les dit puis meurt dans la nuit meurt sur la fitra (la pureté originelle). » Dans Al-Boukhari n° 247 et 6311, il recommande aussi de faire ses ablutions avant et de se coucher sur le côté droit, et la version dit « aslamtu wajhî » au lieu de « aslamtu nafsî ». Certaines versions disent « wa bi-nabiyyika »."}, {"titre": "Âyat al-Koursî", "quand": "En se mettant au lit", "ar": "ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌۭ وَلَا نَوْمٌۭ ۚ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍۢ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ", "phon": "Allâhu lâ ilâha illâ huwa-l-hayyu-l-qayyûm, lâ ta'khudhuhû sinatun wa lâ nawm, lahû mâ fi-s-samâwâti wa mâ fi-l-ard, man dha-lladhî yashfa'u 'indahû illâ bi-idhnih, ya'lamu mâ bayna aydîhim wa mâ khalfahum, wa lâ yuhîtûna bi-shay'in min 'ilmihî illâ bimâ shâ', wasi'a kursiyyuhu-s-samâwâti wa-l-ard, wa lâ ya'ûduhû hifzhuhumâ, wa huwa-l-'aliyyu-l-'azhîm.", "fr": "Allah! Point de divinité à part Lui, le Vivant, Celui qui subsiste par lui-même «Al-Qayyûm». Ni somnolence ni sommeil ne Le saisissent. A Lui appartient tout ce qui est dans les cieux et sur la terre. Qui peut intercéder auprès de Lui sans Sa permission? Il connaît leur passé et leur futur. Et, de Sa science, ils n'embrassent que ce qu'Il veut. Son Trône «Kursiy», déborde les cieux et la terre, dont la garde ne Lui coûte aucune peine. Et Il est le Très Haut, le Très Grand.", "src": "Coran, La Vache (Al-Baqara) 2:255 (trad. Hamidullah) ; mérite : Al-Boukhari n° 2311, d'après Abou Hourayra", "note": "Mérite : « Tu ne cesseras d'avoir auprès d'Allah un gardien, et aucun diable ne t'approchera jusqu'au matin », parole que le Prophète ﷺ a confirmée (« il t'a dit vrai alors qu'il est grand menteur »). Dans Al-Boukhari, ce hadith est rapporté sous forme « mu'allaq » (introduit par « Et 'Othmân ibn al-Haytham a dit », sans chaîne complète jusqu'à Boukhari) ; il est néanmoins considéré comme authentique par les spécialistes ; cette réserve technique est signalée par souci d'exactitude."}, {"titre": "Les trois sourates protectrices", "quand": "En se mettant au lit, chaque nuit : 3 fois", "ar": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ هُوَ ٱللَّهُ أَحَدٌ ٱللَّهُ ٱلصَّمَدُ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ ۝ بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ مِن شَرِّ مَا خَلَقَ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ۝ بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ مَلِكِ ٱلنَّاسِ إِلَٰهِ ٱلنَّاسِ مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ", "phon": "Qul huwa-llâhu ahad, Allâhu-s-samad, lam yalid wa lam yûlad, wa lam yakun lahû kufuwan ahad. — Qul a'ûdhu bi-rabbi-l-falaq, min sharri mâ khalaq, wa min sharri ghâsiqin idhâ waqab, wa min sharri-n-naffâthâti fi-l-'uqad, wa min sharri hâsidin idhâ hasad. — Qul a'ûdhu bi-rabbi-n-nâs, maliki-n-nâs, ilâhi-n-nâs, min sharri-l-waswâsi-l-khannâs, alladhî yuwaswisu fî sudûri-n-nâs, mina-l-jinnati wa-n-nâs.", "fr": "Dis: «Il est Allah, Unique. Allah, Le Seul à être imploré pour ce que nous désirons. Il n'a jamais engendré, n'a pas été engendré non plus. Et nul n'est égal à Lui». — Dis: «Je cherche protection auprès du Seigneur de l'aube naissante, contre le mal des êtres qu'Il a créés, contre le mal de l'obscurité quand elle s'approfondit, contre le mal de celles qui soufflent [les sorcières] sur les nœuds, et contre le mal de l'envieux quand il envie». — Dis: «Je cherche protection auprès du Seigneur des hommes. Le Souverain des hommes, Dieu des hommes, contre le mal du mauvais conseiller, furtif, qui souffle le mal dans les poitrines des hommes, qu'il (le conseiller) soit un djinn, ou un être humain».", "src": "Coran, sourates 112 (Al-Ikhlâs), 113 (Al-Falaq) et 114 (An-Nâs) (trad. Hamidullah) ; pratique : Al-Boukhari n° 5017, d'après 'Âïcha", "note": "Le Prophète ﷺ joignait les paumes, y soufflait légèrement, y récitait ces trois sourates, puis passait les mains sur ce qu'il pouvait de son corps en commençant par la tête, le visage et le devant du corps ; il le faisait 3 fois. Le texte coranique affiché (api.alquran.cloud) inclut la basmala en tête de chaque sourate."}]}, {"label": "🚪 Sortir / entrer à la maison", "items": [{"titre": "En sortant de la maison", "quand": "En quittant son domicile", "ar": "بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ", "phon": "Bismi-llâh, tawakkaltu 'ala-llâh, lâ hawla wa lâ quwwata illâ bi-llâh.", "fr": "Au nom d'Allah, je place ma confiance en Allah ; il n'y a de force ni de puissance qu'en Allah.", "src": "Abou Dawoud n° 5095 et At-Tirmidhi n° 3426, d'après Anas ibn Mâlik — jugé authentique (sahih) par Al-Albani", "note": "Même invocation que dans la rubrique Voyage. Il est alors dit à celui qui la prononce : « Tu es guidé, suffi et protégé », et le diable s'écarte de lui."}, {"titre": "En sortant (autre formule)", "quand": "En sortant de chez soi", "ar": "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أَضِلَّ أَوْ أُضَلَّ أَوْ أَزِلَّ أَوْ أُزَلَّ أَوْ أَظْلِمَ أَوْ أُظْلَمَ أَوْ أَجْهَلَ أَوْ يُجْهَلَ عَلَىَّ", "phon": "Allâhumma innî a'ûdhu bika an adilla aw udalla, aw azilla aw uzalla, aw azhlima aw uzhlama, aw ajhala aw yujhala 'alayy.", "fr": "Ô Allah, je cherche refuge auprès de Toi contre le fait de m'égarer ou d'être égaré, de faire un faux pas ou d'y être poussé, d'être injuste ou de subir une injustice, d'agir avec ignorance (emportement) ou d'en être la cible.", "src": "Abou Dawoud n° 5094, d'après Oumm Salama — jugé authentique (sahih) par Al-Albani", "note": "Oumm Salama rapporte que le Prophète ﷺ ne sortait jamais de chez elle sans lever les yeux vers le ciel et dire ces mots. Avis divergent : Zubair Ali Zai l'a jugé faible (da'îf) ; Shu'ayb Al-Arna'ut : hasan sahih."}, {"titre": "En entrant à la maison", "quand": "En entrant chez soi (et en mangeant)", "ar": "بِسْمِ اللَّهِ", "phon": "Bismi-llâh.", "fr": "Au nom d'Allah.", "src": "Muslim n° 2018, d'après Jâbir ibn 'Abdillah", "note": "Le hadith dit : « Lorsque l'homme entre chez lui et mentionne Allah en entrant et en mangeant, le diable dit [à ses compagnons] : Pas de gîte ni de dîner pour vous. » Le texte ne cite pas de formule précise ; « بِسْمِ اللَّهِ » est ici copié d'Ibn Mâja n° 3264 (la 2e version parle de mentionner le nom d'Allah : « يَذْكُرِ اسْمَ اللَّهِ ») ; « Bismi-llâh » est donc la manière la plus simple d'appliquer ce hadith, et non une citation mot à mot. L'invocation « Allâhumma innî as'aluka khayra-l-mawlij… » (Abou Dawoud n° 5096) n'est pas retenue : jugée faible (da'îf) par Al-Albani."}]}, {"label": "🕌 Mosquée", "items": [{"titre": "En entrant à la mosquée", "quand": "En franchissant la porte de la mosquée", "ar": "اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ", "phon": "Allâhumma-ftah lî abwâba rahmatik.", "fr": "Ô Allah, ouvre-moi les portes de Ta miséricorde.", "src": "Muslim n° 713, d'après Abou Houmayd ou Abou Ousayd", "note": "Le narrateur hésite entre les deux Compagnons Abou Houmayd et Abou Ousayd ; cela n'affecte pas l'authenticité."}, {"titre": "En sortant de la mosquée", "quand": "En quittant la mosquée", "ar": "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", "phon": "Allâhumma innî as'aluka min fadlik.", "fr": "Ô Allah, je Te demande [une part] de Ta grâce.", "src": "Muslim n° 713, d'après Abou Houmayd ou Abou Ousayd", "note": "Même hadith que l'invocation d'entrée."}]}, {"label": "🚻 Toilettes", "items": [{"titre": "Avant d'entrer aux toilettes", "quand": "Juste avant d'entrer (pas à l'intérieur)", "ar": "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ", "phon": "Allâhumma innî a'ûdhu bika mina-l-khubuthi wa-l-khabâ'ith.", "fr": "Ô Allah, je cherche refuge auprès de Toi contre les démons mâles et femelles.", "src": "Al-Boukhari n° 6322 (et 142) et Muslim n° 375, d'après Anas ibn Mâlik", "note": "Al-Boukhari n° 142 cite une version précisant « lorsqu'il voulait entrer ». « Al-khubuth wa-l-khabâ'ith » : les démons mâles et femelles (autre sens donné : le mal et les êtres malfaisants). Muslim n° 375 a aussi la version « أَعُوذُ بِاللَّهِ مِنَ الْخُبْثِ وَالْخَبَائِثِ »."}, {"titre": "En sortant des toilettes", "quand": "En sortant", "ar": "غُفْرَانَكَ", "phon": "Ghufrânak.", "fr": "[Je Te demande] Ton pardon.", "src": "Abou Dawoud n° 30, At-Tirmidhi n° 7 et Ibn Mâja n° 300, d'après 'Âïcha — jugé authentique (sahih) par Al-Albani", "note": "At-Tirmidhi l'a qualifié de « hasan gharib »."}]}, {"label": "💧 Après les ablutions", "items": [{"titre": "L'attestation après les ablutions", "quand": "Après avoir terminé ses ablutions", "ar": "أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ", "phon": "Ash-hadu an lâ ilâha illa-llâhu wahdahû lâ sharîka lah, wa ash-hadu anna Muhammadan 'abduhû wa rasûluh.", "fr": "J'atteste qu'il n'y a de divinité qu'Allah, Seul, sans associé, et j'atteste que Muhammad est Son serviteur et Son messager.", "src": "Muslim n° 234, d'après 'Oqba ibn 'Âmir (rapporté de 'Omar)", "note": "Mérite : les huit portes du Paradis lui sont ouvertes, il entre par celle qu'il veut. La première version de Muslim n° 234 dit : « أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَنَّ مُحَمَّدًا عَبْدُ اللَّهِ وَرَسُولُهُ » ; le texte affiché est celui de la 2e version (avec « wahdahû lâ sharîka lah »)."}, {"titre": "Ajout : parmi les repentants", "quand": "Après l'attestation ci-dessus", "ar": "اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ", "phon": "Allâhumma-j'alnî mina-t-tawwâbîna wa-j'alnî mina-l-mutatahhirîn.", "fr": "Ô Allah, place-moi parmi ceux qui se repentent sans cesse et place-moi parmi ceux qui se purifient.", "src": "At-Tirmidhi n° 55, d'après 'Omar ibn al-Khattâb — jugé authentique (sahih) par Al-Albani", "note": "Prudence : At-Tirmidhi lui-même signale une confusion (idtirâb) dans la chaîne de ce hadith, et Zubair Ali Zai l'a jugé faible (da'îf) ; Al-Albani l'a jugé authentique par d'autres voies. L'attestation qui précède est, elle, dans Muslim."}]}, {"label": "😠 Colère", "items": [{"titre": "Quand la colère monte", "quand": "Dès que l'on sent la colère", "ar": "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ", "phon": "A'ûdhu bi-llâhi mina-sh-shaytâni-r-rajîm.", "fr": "Je cherche refuge auprès d'Allah contre le diable maudit (lapidé).", "src": "Al-Boukhari n° 6115 et Muslim n° 2610, d'après Soulaymân ibn Sourad", "note": "Le Prophète ﷺ, voyant un homme rouge de colère, a dit : « Je connais une parole qui, s'il la disait, dissiperait ce qu'il ressent. »"}, {"titre": "Le conseil : ne te mets pas en colère", "quand": "Rappel à méditer", "ar": "لاَ تَغْضَبْ", "phon": "Lâ taghdab.", "fr": "Ne te mets pas en colère.", "src": "Al-Boukhari n° 6116, d'après Abou Hourayra", "note": "Ce n'est pas une invocation : c'est le conseil que le Prophète ﷺ a répété plusieurs fois à un homme qui lui demandait : « Conseille-moi. »"}]}, {"label": "😔 Tristesse et angoisse", "items": [{"titre": "Contre les soucis et la tristesse", "quand": "À tout moment ; le Prophète ﷺ la disait souvent", "ar": "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ", "phon": "Allâhumma innî a'ûdhu bika mina-l-hammi wa-l-hazan, wa-l-'ajzi wa-l-kasal, wa-l-jubni wa-l-bukhl, wa dala'i-d-dayn, wa ghalabati-r-rijâl.", "fr": "Ô Allah, je cherche refuge auprès de Toi contre le souci et la tristesse, contre l'incapacité et la paresse, contre la lâcheté et l'avarice, contre le poids écrasant des dettes et contre la domination des hommes.", "src": "Al-Boukhari n° 6369, d'après Anas ibn Mâlik (aussi n° 2893, 5425, 6363)", "note": "Dans certaines versions de Boukhari, l'ordre est « al-bukhli wa-l-jubn » (l'avarice et la lâcheté)."}, {"titre": "L'invocation de la détresse", "quand": "Dans les moments d'angoisse ou d'épreuve", "ar": "لاَ إِلَهَ إِلاَّ اللَّهُ الْعَظِيمُ الْحَلِيمُ، لاَ إِلَهَ إِلاَّ اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لاَ إِلَهَ إِلاَّ اللَّهُ رَبُّ السَّمَوَاتِ، وَرَبُّ الأَرْضِ، وَرَبُّ الْعَرْشِ الْكَرِيمِ", "phon": "Lâ ilâha illa-llâhu-l-'azhîmu-l-halîm, lâ ilâha illa-llâhu rabbu-l-'arshi-l-'azhîm, lâ ilâha illa-llâhu rabbu-s-samâwâti wa rabbu-l-ardi wa rabbu-l-'arshi-l-karîm.", "fr": "Il n'y a de divinité qu'Allah, l'Immense, le Longanime. Il n'y a de divinité qu'Allah, Seigneur du Trône immense. Il n'y a de divinité qu'Allah, Seigneur des cieux, Seigneur de la terre et Seigneur du Trône noble.", "src": "Al-Boukhari n° 6346 et Muslim n° 2730, d'après Ibn 'Abbâs", "note": "Le Prophète ﷺ la disait « au moment de la détresse » (عِنْدَ الْكَرْبِ). Al-Boukhari n° 6345 rapporte une version plus courte."}, {"titre": "L'invocation de Jonas (Dhû-n-Noûn)", "quand": "Dans la détresse, pour toute demande", "ar": "لاَ إِلَهَ إِلاَّ أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", "phon": "Lâ ilâha illâ anta subhânaka innî kuntu mina-zh-zhâlimîn.", "fr": "Pas de divinité à part Toi! Pureté à Toi! J'ai été vraiment du nombre des injustes", "src": "Coran, Les Prophètes (Al-Anbiyâ') 21:87 (trad. Hamidullah) ; mérite : At-Tirmidhi n° 3505, d'après Sa'd ibn Abî Waqqâs — jugé authentique (sahih) par Al-Albani", "note": "Texte arabe copié d'At-Tirmidhi n° 3505 (mêmes mots que le verset, où il est précédé de « أَن »). Le hadith dit : « Aucun musulman ne l'a invoquée pour quelque chose sans qu'Allah ne l'exauce. »"}]}, {"label": "🤒 Malade", "items": [{"titre": "En rendant visite à un malade", "quand": "En entrant chez le malade", "ar": "لاَ بَأْسَ طَهُورٌ إِنْ شَاءَ اللَّهُ", "phon": "Lâ ba'sa, tahûrun in shâ'a-llâh.", "fr": "Ce n'est rien : [cette maladie est] une purification, si Allah le veut.", "src": "Al-Boukhari n° 5656, d'après Ibn 'Abbâs (aussi n° 3616, 5662)", "note": "Le hadith précise que c'était l'habitude du Prophète ﷺ en visitant un malade."}, {"titre": "Invoquer la guérison pour un malade", "quand": "En passant la main droite sur le malade", "ar": "أَذْهِبِ الْبَاسَ رَبَّ النَّاسِ، اشْفِ وَأَنْتَ الشَّافِي لاَ شِفَاءَ إِلاَّ شِفَاؤُكَ، شِفَاءً لاَ يُغَادِرُ سَقَمًا", "phon": "Adhhibi-l-ba's, rabba-n-nâs, ishfi wa anta-sh-shâfî, lâ shifâ'a illâ shifâ'uk, shifâ'an lâ yughâdiru saqamâ.", "fr": "Fais disparaître le mal, Seigneur des hommes ; guéris, car c'est Toi qui guéris. Il n'y a de guérison que Ta guérison, une guérison qui ne laisse aucune maladie.", "src": "Al-Boukhari n° 5675, d'après 'Âïcha", "note": "Al-Boukhari n° 5743 et 5750 précisent qu'il passait sa main droite sur le malade ; la version 5743 commence par « اللَّهُمَّ رَبَّ النَّاسِ » et dit « اشْفِهِ » (guéris-le)."}, {"titre": "Contre une douleur", "quand": "Poser la main sur l'endroit douloureux : « Bismi-llâh » 3 fois, puis la formule 7 fois", "ar": "بِاسْمِ اللَّهِ (×3) — أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ (×7)", "phon": "Bismi-llâh (3 fois). A'ûdhu bi-llâhi wa qudratihî min sharri mâ ajidu wa uhâdhir (7 fois).", "fr": "Au nom d'Allah (3 fois). Je cherche refuge auprès d'Allah et de Sa puissance contre le mal que je ressens et que je redoute (7 fois).", "src": "Muslim n° 2202, d'après 'Othmân ibn Abî al-'Âs", "note": "Les mentions « (×3) » et « (×7) » sont ajoutées pour l'affichage : le hadith dit « ثَلاَثًا » et « سَبْعَ مَرَّاتٍ ». Le texte de Muslim dit « bi-llâhi wa qudratih » ; la version avec « bi-'izzati-llâh » ne figure pas dans Muslim et n'a pas été retenue ici."}]}, {"label": "🌧️ Pluie", "items": [{"titre": "Quand il pleut", "quand": "En voyant la pluie tomber", "ar": "صَيِّبًا نَافِعًا", "phon": "Sayyiban nâfi'â.", "fr": "[Ô Allah, fais-en] une pluie abondante et bénéfique.", "src": "Al-Boukhari n° 1032, d'après 'Âïcha", "note": "Les mots entre crochets expliquent le sens : la formule dans le texte est seulement « sayyiban nâfi'â »."}, {"titre": "Après la pluie", "quand": "Après la pluie", "ar": "مُطِرْنَا بِفَضْلِ اللَّهِ وَرَحْمَتِهِ", "phon": "Mutirnâ bi-fadli-llâhi wa rahmatih.", "fr": "Nous avons reçu la pluie par la grâce d'Allah et Sa miséricorde.", "src": "Al-Boukhari n° 846 (et 1038) et Muslim n° 71, d'après Zayd ibn Khâlid Al-Juhanî", "note": "Hadith qudsî : celui qui dit cela croit en Allah ; celui qui attribue la pluie à tel astre croit aux astres et renie Allah."}, {"titre": "Quand la pluie devient excessive", "quand": "Lorsque la pluie trop abondante cause du tort", "ar": "اللَّهُمَّ حَوَالَيْنَا وَلاَ عَلَيْنَا، اللَّهُمَّ عَلَى الآكَامِ وَالْجِبَالِ وَالآجَامِ وَالظِّرَابِ وَالأَوْدِيَةِ وَمَنَابِتِ الشَّجَرِ", "phon": "Allâhumma hawâlaynâ wa lâ 'alaynâ, Allâhumma 'ala-l-âkâmi wa-l-jibâli wa-l-âjâmi wa-zh-zhirâbi wa-l-awdiyati wa manâbiti-sh-shajar.", "fr": "Ô Allah, [fais-la tomber] autour de nous et non sur nous. Ô Allah, sur les collines, les montagnes, les bosquets, les hauteurs, les vallées et là où poussent les arbres.", "src": "Al-Boukhari n° 1013, d'après Anas ibn Mâlik", "note": "Invocation faite par le Prophète ﷺ pendant le sermon du vendredi, après une semaine de pluie ininterrompue ; la pluie cessa aussitôt."}]}, {"label": "🤧 Éternuement", "items": [{"titre": "Celui qui éternue", "quand": "Après avoir éternué", "ar": "الْحَمْدُ لِلَّهِ", "phon": "Al-hamdu li-llâh.", "fr": "Louange à Allah.", "src": "Al-Boukhari n° 6224, d'après Abou Hourayra", "note": "Les trois formules de ce thème viennent du même hadith."}, {"titre": "Celui qui l'entend", "quand": "En réponse à celui qui a éternué et loué Allah", "ar": "يَرْحَمُكَ اللَّهُ", "phon": "Yarhamuka-llâh.", "fr": "Qu'Allah te fasse miséricorde.", "src": "Al-Boukhari n° 6224, d'après Abou Hourayra", "note": "À dire à celui qui a dit « al-hamdu li-llâh » (le hadith dit : « que son frère ou son compagnon lui dise »)."}, {"titre": "La réponse de celui qui a éternué", "quand": "Quand on lui a dit « yarhamuka-llâh »", "ar": "يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ", "phon": "Yahdîkumu-llâhu wa yuslihu bâlakum.", "fr": "Qu'Allah vous guide et améliore votre état.", "src": "Al-Boukhari n° 6224, d'après Abou Hourayra", "note": null}]}, {"label": "🌅 Matin et soir", "items": [{"titre": "Le maître des demandes de pardon (Sayyid al-istighfâr)", "quand": "Le matin et le soir, une fois", "ar": "اللَّهُمَّ أَنْتَ رَبِّي، لاَ إِلَهَ إِلاَّ أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَىَّ وَأَبُوءُ لَكَ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لاَ يَغْفِرُ الذُّنُوبَ إِلاَّ أَنْتَ", "phon": "Allâhumma anta rabbî, lâ ilâha illâ ant, khalaqtanî wa ana 'abduk, wa ana 'alâ 'ahdika wa wa'dika mastata't, a'ûdhu bika min sharri mâ sana't, abû'u laka bi-ni'matika 'alayya, wa abû'u laka bi-dhanbî, fa-ghfir lî, fa-innahû lâ yaghfiru-dh-dhunûba illâ ant.", "fr": "Ô Allah, Tu es mon Seigneur, il n'y a de divinité que Toi. Tu m'as créé et je suis Ton serviteur ; je reste fidèle à Ton pacte et à Ta promesse autant que je le peux. Je cherche refuge auprès de Toi contre le mal que j'ai commis. Je reconnais devant Toi Tes bienfaits envers moi et je reconnais mon péché ; pardonne-moi donc, car nul ne pardonne les péchés en dehors de Toi.", "src": "Al-Boukhari n° 6306, d'après Chaddâd ibn Aws", "note": "Mérite : celui qui la dit le jour avec certitude et meurt avant le soir, ou la nuit et meurt avant le matin, est des gens du Paradis. Le hadith dit « de jour » / « de nuit » ; la récitation matin et soir en découle."}, {"titre": "Gloire et louange à Allah", "quand": "Le matin et le soir : 100 fois", "ar": "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", "phon": "Subhâna-llâhi wa bi-hamdih.", "fr": "Gloire et louange à Allah.", "src": "Muslim n° 2692, d'après Abou Hourayra", "note": "Mérite : personne ne viendra au Jour de la Résurrection avec mieux, sauf celui qui aura dit autant ou davantage. Dans Muslim n° 2691, dite 100 fois par jour, elle efface les péchés même s'ils sont comme l'écume de la mer."}, {"titre": "La protection par le nom d'Allah", "quand": "Le matin et le soir : 3 fois", "ar": "بِسْمِ اللَّهِ الَّذِي لاَ يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الأَرْضِ وَلاَ فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", "phon": "Bismi-llâhi-lladhî lâ yadurru ma'a-smihî shay'un fi-l-ardi wa lâ fi-s-samâ', wa huwa-s-samî'u-l-'alîm.", "fr": "Au nom d'Allah, avec le nom duquel rien ne peut nuire sur terre ni dans le ciel, et Il est Celui qui entend tout, Celui qui sait tout.", "src": "At-Tirmidhi n° 3388 et Abou Dawoud n° 5088, d'après 'Othmân ibn 'Affân — jugé bon et authentique (hasan sahih) par Al-Albani (sahih pour Abou Dawoud)", "note": "Mérite : rien ne lui nuira (Tirmidhi) ; il ne sera pas frappé par une épreuve soudaine jusqu'au matin / jusqu'au soir (Abou Dawoud). Aussi chez Ibn Mâja n° 3869 (sahih selon Al-Albani)."}]}];
function themesCit(){
  const t=CITADELLE.map(x=>({label:x.label,items:x.items}));
  const v={label:'✈️ Voyage',items:VOYAGE,voyage:true};
  const iFam=t.findIndex(x=>/Famille/.test(x.label));
  t.splice(iFam>=0?iFam+1:t.length,0,v);
  return t;
}

-Boukhari n° 4704","📖 « Nous t'avons certes donné «les sept versets que l'on répète», ainsi que le Coran sublime. » (Coran 15:87, trad. Hamidullah)"],["a","coran","Quelle nuit est « meilleure que mille mois » ?",["Laylat al-Qadr (la nuit du Destin)","La nuit du vendredi","La nuit de l'Aïd","La nuit de ʿArafat"],"Coran 97:3","📖 « La nuit d'Al-Qadr est meilleure que mille mois. » (Coran 97:3, trad. Hamidullah)"],["a","coran","Dans quelle sourate se trouve Âyat al-Koursî ?",["Al-Baqara","Âl ʿImrân","Yâ-Sîn","Al-Moulk"],"Coran 2:255","📖 « Allah! Point de divinité à part Lui, le Vivant, Celui qui subsiste par lui-même «Al-Qayyûm». Ni somnolence ni sommeil ne Le saisissent. A Lui appartient tout ce qui est dans les cieux et sur la terre. Qui peut intercéder auprès de Lui sans Sa permission? Il connaît leur passé et leur futur. Et, de Sa science, ils n'embrassent que ce qu'Il veut. Son Trône «Kursiy», déborde les cieux et la terre, dont la garde ne Lui coûte aucune peine. Et Il est le Très Haut, le Très Grand. » (Coran 2:255, trad. Hamidullah)"],["a","coran","Quelles sourates le Prophète ﷺ récitait-il en soufflant dans ses mains avant de dormir ?",["Al-Ikhlâs, Al-Falaq et An-Nâs","Al-Fâtiha et Al-Baqara","Yâ-Sîn et Al-Moulk","Al-Kahf et Maryam"],"Al-Boukhari n° 5017, d'après ʿÂ'icha","ʿÂ'icha : « Chaque nuit, en se couchant, le Prophète ﷺ joignait ses mains, soufflait dedans après avoir récité Al-Ikhlâs, Al-Falaq et An-Nâs, puis les passait sur ce qu'il pouvait de son corps, en commençant par la tête et le visage. Il le faisait trois fois. »"],["a","coran","Les deux derniers versets de quelle sourate « suffisent » à celui qui les récite la nuit ?",["Al-Baqara","Al-Kahf","Al-Moulk","Âl ʿImrân"],"Al-Boukhari n° 5009, d'après Abou Masʿoûd","« Celui qui récite les deux derniers versets de la sourate Al-Baqara la nuit, ils lui suffiront. »"],["a","coran","Combien de catégories de personnes peuvent recevoir la zakât selon le Coran ?",["8","4","6","10"],"Coran 9:60","📖 « Les ?adaqâts ne sont destinés que pour les pauvres, les indigents, ceux qui y travaillent, ceux dont les cœurs sont à gagner (à l'Islam), l'affranchissement des jougs, ceux qui sont lourdement endettés, dans le sentier d'Allah, et pour le voyageur (en détresse). C'est un décret d'Allah! Et Allah est Omniscient et Sage. » (Coran 9:60, trad. Hamidullah)"],["a","coran","Combien y a-t-il de mois sacrés selon le Coran ?",["4","2","3","6"],"Coran 9:36","📖 « Le nombre de mois, auprès d'Allah, est de douze [mois], dans la prescription d'Allah, le jour où Il créa les cieux et la terre. Quatre d'entre eux sont sacrés: telle est la religion droite. [Durant ces mois], ne faites pas de tort à vous-mêmes. Combattez les associateurs sans exception, comme ils vous combattent sans exception. Et sachez qu'Allah est avec les pieux. » (Coran 9:36, trad. Hamidullah)"],["a","coran","Quel sage du Coran a donné des conseils à son fils ?",["Louqmân","Al-Khadir","Dhoul-Qarnayn","ʿOuzayr"],"Coran 31:13","📖 « Et lorsque Luqmân dit à son fils tout en l'exhortant: «O mon fils, ne donne pas d'associé à Allah, car l'association à [Allah] est vraiment une injustice énorme.» » (Coran 31:13, trad. Hamidullah)"],["a","coran","Selon le Coran, que s'est-il passé pour ʿÎsâ (Jésus) ?",["Il n'a été ni tué ni crucifié : Allah l'a élevé vers Lui","Il a été crucifié","Il est mort de vieillesse","Il est parti en Inde"],"Coran 4:157-158","📖 « et à cause de leur parole: «Nous avons vraiment tué le Christ, Jésus, fils de Marie, le Messager d'Allah»... Or, ils ne l'ont ni tué ni crucifié; mais ce n'était qu'un faux semblant! Et ceux qui ont discuté sur son sujet sont vraiment dans l'incertitude: ils n'en ont aucune connaissance certaine, ils ne font que suivre des conjectures et ils ne l'ont certainement pas tué, mais Allah l'a élevé vers Lui. Et Allah est Puissant et Sage. » (Coran 4:157-158, trad. Hamidullah)"],["a","prophetes","Quel prophète est surnommé « l'homme au poisson » (Dhou-n-Noûn) ?",["Yoûnous (Jonas)","Moûsâ (Moïse)","Ayyoûb (Job)","Ilyâs (Élie)"],"Coran 21:87","📖 « Et Dû'n-Nûn (Jonas) quand il partit, irrité. Il pensa que Nous N'allions pas l'éprouver. Puis il fit, dans les ténèbres, l'appel que voici: «Pas de divinité à part Toi! Pureté à Toi! J'ai été vraiment du nombre des injustes». » (Coran 21:87, trad. Hamidullah)"],["a","prophetes","Quel prophète est cité dans le Coran pour sa patience face à la maladie ?",["Ayyoûb (Job)","Yoûnous (Jonas)","Zakariyyâ","Idrîs"],"Coran 38:41-44","📖 « «Et prends dans ta main un faisceau de brindilles, puis frappe avec cela. Et ne viole pas ton serment». Oui, Nous l'avons trouvé vraiment endurant. Quel bon serviteur! Sans cesse il se repentait. » (Coran 38:44, trad. Hamidullah)"],["a","prophetes","À quel prophète Allah a-t-Il rendu le fer malléable ?",["Dâwoûd (David)","Soulaymân (Salomon)","Dhoul-Qarnayn","Noûh (Noé)"],"Coran 34:10","📖 « Nous avons certes accordé une grâce à David de Notre part. O montagnes et oiseaux, répétez avec lui (les louanges d'Allah). Et pour lui, Nous avons amolli le fer, » (Coran 34:10, trad. Hamidullah)"],["a","prophetes","Quel prophète a été envoyé au peuple de ʿÂd ?",["Hoûd","Sâlih","Choʿayb","Loût (Loth)"],"Coran 7:65","📖 « Et aux 'Aad, leur frère Hûd: «O mon peuple, dit-il, adorez Allah. Pour vous, pas d'autre divinité que Lui. Ne [Le] craignez-vous donc pas?» » (Coran 7:65, trad. Hamidullah)"],["a","prophetes","Quel prophète a été envoyé au peuple de Madyan ?",["Choʿayb","Hoûd","Sâlih","Idrîs"],"Coran 7:85","📖 « Et aux Madyan, leur frère Chu'aïb: «O mon peuple, dit-il, adorez Allah. Pour vous, pas d'autre divinité que Lui. Une preuve vous est venue de votre Seigneur. Donnez donc la pleine mesure et le poids et ne donnez pas aux gens moins que ce qui leur est dû. Et ne commettez pas de la corruption sur la terre après sa réforme. Ce sera mieux pour vous si vous êtes croyants. » (Coran 7:85, trad. Hamidullah)"],["a","prophetes","Qui est le père du prophète Yahyâ (Jean) ?",["Zakariyyâ (Zacharie)","ʿImrân","Yaʿqoûb (Jacob)","Dâwoûd (David)"],"Coran 19:7","📖 « «O Zacharie, Nous t'annonçons la bonne nouvelle d'un fils. Son nom sera Yahya [Jean]. Nous ne lui avons pas donné auparavant d'homonyme». » (Coran 19:7, trad. Hamidullah)"],["a","prophetes","Quel prophète a vu en rêve qu'il devait sacrifier son fils ?",["Ibrâhîm (Abraham)","Yaʿqoûb (Jacob)","Noûh (Noé)","Zakariyyâ"],"Coran 37:102","📖 « Puis quand celui-ci fut en âge de l'accompagner, [Abraham] dit: «O mon fils, je me vois en songe en train de t'immoler. Vois donc ce que tu en penses». (Ismaël) dit: «O mon cher père, fais ce qui t'es commandé: tu me trouveras, s'il plaît à Allah, du nombre des endurants». » (Coran 37:102, trad. Hamidullah)"],["a","prophetes","Dans quelle maison Moûsâ (Moïse) a-t-il grandi ?",["Celle de Pharaon","Celle de Choʿayb","Celle de Hâroûn","Celle de Haman"],"Coran 28:8-9","📖 « Les gens de Pharaon le recueillirent, pour qu'il leur soit un ennemi et une source d'affliction! Pharaon, Hâmân et leurs soldats étaient fautifs. Et la femme de Pharaon dit: «(Cet enfant) réjouira mon œil et le tien! Ne le tuez pas. Il pourrait nous être utile ou le prendrons-nous pour enfant». Et ils ne pressentaient rien. » (Coran 28:8-9, trad. Hamidullah)"],["a","prophetes","Comment s'appelait l'épouse croyante de Pharaon ?",["Âsiya","Maryam","Bilqîs","Hâjar"],"Al-Boukhari n° 3411, d'après Abou Moûsâ","« Beaucoup d'hommes ont atteint la perfection, mais parmi les femmes, seules Âsiya, l'épouse de Pharaon, et Maryam, fille de ʿImrân, l'ont atteinte. »"],["a","prophetes","Quel prophète a dit : « Seigneur, ne me laisse pas seul » en demandant un enfant ?",["Zakariyyâ (Zacharie)","Ibrâhîm (Abraham)","Noûh (Noé)","Ayyoûb (Job)"],"Coran 21:89","📖 « Et Zacharie, quand il implora son Seigneur: «Ne me laisse pas seul, Seigneur, alors que Tu es le meilleur des héritiers». » (Coran 21:89, trad. Hamidullah)"],["a","sira","Comment s'appelle la grotte où le Prophète ﷺ et Abou Bakr se sont cachés pendant l'Hégire ?",["Thawr ue vous étiez humiliés. Craignez Allah donc. Afin que vous soyez reconnaissants! » (Coran 3:123, trad. Hamidullah)"],["a","sira","Quel compagnon le Prophète ﷺ a-t-il appelé « As-Siddîq » (le véridique) ?",["Abou Bakr","ʿOmar","ʿOthmân","ʿAlî"],"Al-Boukhari n° 3675, d'après Anas","Le Prophète ﷺ monta sur le mont Ouhoud avec Abou Bakr, ʿOmar et ʿOthmân, et la montagne trembla. Il dit : « Sois ferme, Ouhoud ! Il n'y a sur toi qu'un Prophète, un Siddîq et deux martyrs. »"],["a","sira","Quel compagnon a été chargé de rassembler le Coran par écrit sous Abou Bakr ?",["Zayd ibn Thâbit","Abou Hourayra","Ibn ʿAbbâs","Moʿâdh ibn Jabal"],"Al-Boukhari n° 4986, d'après Zayd ibn Thâbit","Après la bataille de Yamâma où beaucoup de récitateurs moururent, ʿOmar demanda à Abou Bakr de faire rassembler le Coran. Abou Bakr confia cette tâche à Zayd ibn Thâbit, qui écrivait la révélation pour le Prophète ﷺ."],["a","sira","Comment s'appelait la première épouse du Prophète ﷺ ?",["Khadîja","ʿÂ'icha","Hafsa","Sawda"],"Biographie du Prophète ﷺ (sîra) ; Al-Boukhari n° 3","Khadîja fut la première épouse du Prophète ﷺ. Lors de la première révélation, c'est auprès d'elle qu'il revint, tremblant, et elle le réconforta."],["a","piliers","Combien de fois la prière en groupe vaut-elle plus que la prière seul ?",["27 fois","10 fois","40 fois","70 fois"],"Al-Boukhari n° 645, d'après Ibn ʿOmar","« La prière en groupe est supérieure de vingt-sept degrés à la prière faite seul. »"],["a","piliers","Quel est le taux de la zakât sur l'argent épargné ?",["2,5 % (un quarantième)","10 %","5 %","20 %"],"Al-Boukhari n° 1454, d'après Anas","Dans la lettre d'Abou Bakr sur la zakât prescrite par le Prophète ﷺ : « Pour l'argent, la zakât est d'un quarantième (soit 2,5 %). »"],["a","piliers","Que doit-on dire quand on entend l'adhan ?",["Répéter ce que dit le muezzin","Rester silencieux","Dire « Âmîn »","Réciter Al-Fâtiha"],"Al-Boukhari n° 611, d'après Abou Saʿîd Al-Khoudri","« Quand vous entendez l'appel à la prière, dites ce que dit le muezzin. »"],["a","piliers","Comment s'appelle la porte du Paradis réservée aux jeûneurs ?",["Ar-Rayyân","Al-Firdaws","As-Salâm","Al-Kawthar"],"Al-Boukhari n° 1896, d'après Sahl ibn Saʿd","« Il y a au Paradis une porte appelée Ar-Rayyân, par laquelle entreront les jeûneurs le Jour de la Résurrection ; nul autre qu'eux n'y entrera. »"],["a","piliers","Le jeûne de quel jour efface les péchés de l'année passée et de l'année à venir ?",["Le jour de ʿArafat","Le jour de Achoura","Le premier jour de Ramadan","Le 15 Chaʿbân"],"Muslim n° 1162, d'après Abou Qatada","« J'espère d'Allah que le jeûne du jour de ʿArafat efface les péchés de l'année passée et de l'année à venir, et que le jeûne de Achoura efface les péchés de l'année passée. »"],["a","piliers","Quel mois est appelé « le mois d'Allah », dont le jeûne est le meilleur après le Ramadan ?",["Mouharram","Chaʿbân","Rajab","Chawwal"],"Muslim n° 1163, d'après Abou Hourayra","« Le meilleur jeûne après le Ramadan est celui du mois d'Allah, al-Mouharram, et la meilleure prière après les prières obligatoires est la prière de la nuit. »"],["a","piliers","Quelle est la meilleure prière après les prières obligatoires ?",["La prière de la nuit","La prière du Douhâ","La prière de l'Aïd","La prière du vendredi"],"Muslim n° 1163, d'après Abou Hourayra","« Le meilleur jeûne après le Ramadan est celui du mois d'Allah, al-Mouharram, et la meilleure prière après les prières obligatoires est la prière de la nuit. »"],["a","piliers","Le Prophète ﷺ a dit que le meilleur jour où le soleil se lève est…",["Le vendredi","Le lundi","Le jeudi","Le jour de l'Aïd"],"Muslim n° 854, d'après Abou Hourayra","« Le meilleur jour où le soleil se soit levé est le vendredi : c'est ce jour-là qu'Âdam a été créé, qu'il est entré au Paradis et qu'il en est sorti. »"],["a","piliers","Qu'a ordonné le Prophète ﷺ à propos de la zakât al-fitr ?",["La donner avant la prière de l'Aïd","La donner après l'Aïd","La donner en Chawwal","La donner une fois dans sa vie"],"Al-Boukhari n° 1503, d'après Ibn ʿOmar","« Le Messager d'Allah ﷺ a prescrit la zakât al-fitr : un sâʿ de dattes ou d'orge, pour chaque musulman, libre ou esclave, homme ou femme, petit ou grand, et il a ordonné qu'elle soit donnée avant que les gens ne sortent pour la prière [de l'Aïd]. »"],["a","dhikr","Quelles paroles sont « légères sur la langue, lourdes dans la balance » ?",["Soubhâna-llâhi wa bihamdihi, soubhâna-llâhi-l-ʿadhîm","Allâhou akbar","Bismillâh","Astaghfiroullâh"],"Al-Boukhari n° 6406, d'après Abou Hourayra","« Deux paroles légères sur la langue, lourdes dans la balance et aimées du Tout-Miséricordieux : Soubhâna-llâhi wa bihamdihi, soubhâna-llâhi-l-ʿadhîm. »"],["a","dhikr","Quelle parole est « un trésor parmi les trésors du Paradis » ?",["Lâ hawla wa lâ qouwwata illâ billâh","Soubhân Allâh","Al-hamdou lillâh","Mâ châ' Allâh"],"Al-Boukhari n° 6384, d'après Abou Moûsâ","Le Prophète ﷺ dit à Abou Moûsâ : « Ô ʿAbdallah ibn Qays, dis : Lâ hawla wa lâ qouwwata illâ billâh, car c'est un trésor parmi les trésors du Paradis. »"],["a","dhikr","Comment s'appelle la meilleure formule pour demander pardon à Allah ?",["Sayyid al-istighfâr","Âyat al-Koursî","Al-Mouʿawwidhât","Douʿâ' al-qounoût"],"Al-Boukhari n° 6306, d'après Chaddâd ibn Aws","« La meilleure façon de demander pardon (sayyid al-istighfâr) est de dire : Allâhoumma anta rabbî, lâ ilâha illâ anta, khalaqtanî wa ana ʿabdouk… Celui qui la dit le jour avec conviction et meurt avant le soir sera parmi les gens du Paradis. »"],["a","dhikr","Combien de fois par jour le Prophète ﷺ disait-il demander pardon à Allah ?",["Plus de 70 fois","3 fois","10 fois","1 000 fois"],"Al-Boukhari n° 6307, d'après Abou Hourayra","« Par Allah, je demande pardon à Allah et je me repens à Lui plus de soixante-dix fois par jour. »"],["a","foi","Combien de portes l'Enfer a-t-il selon le Coran ?",["7","3","8","12"],"Coran 15:44","📖 « Il a sept portes; et chaque porte en a sa part déterminée». » (Coran 15:44, trad. Hamidullah)"],["a","foi","Que veut dire « Allâhou akbar » ?",["Allah est le plus Grand","Allah est Unique","Gloire à Allah","Louange à Allah"],"Sens de la formule","« Allâhou akbar » signifie « Allah est plus Grand » : plus grand que tout. On le dit pour commencer la prière (takbîr) et dans l'adhan."],["a","foi","Que veut dire « Soubhân Allâh » ?",["Gloire à Allah","Louange à Allah","Allah est le plus Grand","Au nom d'Allah"],"Sens de la formule","« Soubhân Allâh » signifie « Gloire à Allah » : on affirme qu'Allah est pur de tout défaut. On le dit 33 fois après la prière."]];

function rngDe(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
function melanger(L,r){ const a=L.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// questions générées à partir des données vérifiées de l'appli (99 noms, Citadelle)

  const out=[];

function jeunesDuJour(k){

  if(h.m===12&&h.j===9) out.push(['Jour de ʿArafat','« J\'espère d\'Allah que le jeûne du jour de ʿArafat efface les péchés de l\'année passée et de l\'année à venir. »','Muslim n° 1162, d\'après Abou Qatada']);
  if(h.m===1&&h.j===10) out.push(['Achoura (10 Mouharram)','« J\'espère d\'Allah que le jeûne de Achoura efface les péchés de l\'année passée. »','Muslim n° 1162, d\'après Abou Qatada']);
  if(h.m===10&&h.j>=2) out.push(['6 jours de Chawwal','« Celui qui jeûne le Ramadan puis le fait suivre de six jours de Chawwal, c\'est comme s\'il avait jeûné toute l\'année. »','Muslim n° 1164, d\'après Abou Ayyoub']);
  if(h.j>=13&&h.j<=15) out.push(['Jour blanc ('+h.j+' du mois hégirien)','« Si tu jeûnes trois jours dans le mois, jeûne le 13, le 14 et le 15. »','At-Tirmidhi n° 761, d\'après Abou Dharr — hasan sahih']);
  if(w===1) out.push(['Lundi','Interrogé sur le jeûne du lundi : « C\'est le jour où je suis né et où la révélation est descendue sur moi. »','Muslim n° 1162, d\'après Abou Qatada']);

  return {liste:out.filter((x,i,a)=>!(x[0]==='Lundi et jeudi'&&a.some(y=>y[0]==='Lundi')))};
}
