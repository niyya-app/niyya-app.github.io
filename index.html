<style>
:root{
  --bg1:#eef2ff; --bg2:#faf5ff; --card:#ffffff; --card2:#f8f7ff;
  --ink:#0f172a; --muted:#64748b; --line:#e9e7f5;
  --indigo:#6366f1; --violet:#8b5cf6; --emerald:#10b981; --emerald-d:#047857;
  --amber:#f59e0b; --rose:#fb7185; --red:#ef4444;
  --halo1:#e0e7ff; --halo2:#f5e8ff;
  --r:20px; --sh:0 10px 30px rgba(79,70,229,.08);
}
:root[data-theme="dark"]{
  --bg1:#0b1020; --bg2:#130f22; --card:#171b30; --card2:#1d2140;
  --ink:#eceefb; --muted:#9aa3bd; --line:#2a2f4d; --halo1:#1c1f45; --halo2:#2a1740;
  --sh:0 10px 30px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg1:#0b1020; --bg2:#130f22; --card:#171b30; --card2:#1d2140;
    --ink:#eceefb; --muted:#9aa3bd; --line:#2a2f4d; --halo1:#1c1f45; --halo2:#2a1740;
    --sh:0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg1)}
body{
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1000px 500px at 10% -10%,var(--halo1) 0,transparent 55%),
    radial-gradient(900px 500px at 100% 0,var(--halo2) 0,transparent 55%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  min-height:100vh;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));
}
button,input,textarea,select{font-family:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- Entête ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.pbouge{opacity:.72;transition:transform .15s,opacity .15s,box-shadow .15s}
.pdrag{z-index:5;position:relative}.pdrag .pbouge{opacity:1;transform:scale(1.08);box-shadow:0 0 0 3px #fff,0 0 0 6px #10b981,0 14px 24px rgba(0,0,0,.3)}
.pfl{position:absolute;top:10px;right:10px;display:flex;gap:6px}.pfl button{width:34px;height:34px;border-radius:50%;border:none;background:#fff;color:#111;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}.pfl button:disabled{opacity:.35}
.quote .preuve summary{color:#fff;text-decoration:underline dotted}.quote .preuve .pv-fr{background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.92rem;line-height:1.5}.quote.blanc .preuve summary{color:var(--indigo,#4f46e5)}
.preuve{margin-top:10px;font-weight:600}.preuve summary{cursor:pointer;font-weight:800;font-size:.82rem;color:var(--indigo,#4f46e5);list-style:none}.preuve summary::-webkit-details-marker{display:none}.preuve summary::after{content:' ▾'}.preuve[open] summary::after{content:' ▴'}
.pv-ar{font-family:'Amiri',serif;font-size:1.3rem;line-height:2;margin-top:8px;text-align:right}.pv-fr{margin-top:6px;line-height:1.5;font-weight:600}.pv-src{margin-top:6px;font-size:.74rem;color:var(--muted);font-weight:700}
.hpal-bas{display:flex;justify-content:flex-end;margin-top:10px}.hpal-btn{border:none;background:rgba(255,255,255,.2);color:inherit;border-radius:100px;padding:5px 11px;font-weight:800;font-size:.72rem;cursor:pointer}.hero.blanc .hpal-btn{background:var(--card2,#f1f5f9);color:var(--muted)}
.hpal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0 0;padding:10px;border-radius:16px;background:rgba(255,255,255,.22)}
.hero.blanc .hpal{background:var(--card2,#f1f5f9)}
.hpal-pt{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.85);cursor:pointer;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.hpal-pt.blanc{background:#fff;border-color:#cbd5e1}
.hpal-pt.on{outline:3px solid #fde047;outline-offset:2px}
.hero.blanc{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 30px rgba(15,23,42,.08)}
.hero.blanc .h-lbl,.hero.blanc .h-sub{color:var(--muted);opacity:1}
.hero.blanc .qbtn{background:#ecfdf5;color:#047857}
.hero.blanc .pmini{background:var(--card2,#f1f5f9);color:var(--ink)}
.hero.blanc .pmini.sun{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.hero.blanc .plig{background:var(--card2,#f1f5f9);color:var(--ink)}.hero.blanc .plig .pst{background:rgba(0,0,0,.06)}
.hero.blanc .plig.done{background:#10b981;color:#fff}.hero.blanc .plig.done .pst{background:rgba(255,255,255,.25)}.hero.blanc .plig.late{background:#f59e0b;color:#fff}
.hero.blanc .plig.miss{background:#fee2e2;color:#b91c1c}.hero.blanc .plig.next{outline:3px solid #10b981;outline-offset:-3px}.hero.blanc .plig.sun{background:transparent;color:var(--muted)}
.hero.acc .plig{padding:14px 14px;font-size:1.02rem}.hero.acc .plig b{font-size:1.12rem}.hero.acc .plig .ph{font-size:1.1rem}
.hero.blanc .pmini.done{background:#10b981;color:#fff}
.hero.blanc .pmini.late{background:#f59e0b;color:#fff}
.hero.blanc .pmini.miss{background:#fee2e2;color:#b91c1c}
.hero.blanc .pmini.next{outline:2px solid #10b981;outline-offset:-2px}
.hero.blanc::before,.hero.blanc::after{display:none}
.logo{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9rem;letter-spacing:.02em;
  background:linear-gradient(135deg,#6366f1,#ec4899);box-shadow:0 8px 18px rgba(99,102,241,.35)}
.brand h1{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand h1 span{background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{color:var(--muted);font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:100px;padding:6px 12px;font-weight:800;font-size:.74rem;white-space:nowrap;border:1px solid}
.pill.ok{background:#ecfdf5;color:var(--emerald-d);border-color:#a7f3d0}
.pill.wait{background:#fffbeb;color:#b45309;border-color:#fde68a}
.pill.off{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* Navigation de date */
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.daynav button{border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;font-size:1rem;font-weight:800;cursor:pointer;box-shadow:var(--sh)}
.daynav button:disabled{opacity:.35}
.daynav .lbl{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:var(--sh)}
.daynav .lbl b{display:block;font-size:.95rem}
.daynav .lbl small{color:var(--muted);font-weight:600;font-size:.74rem}
.daynav .back{width:auto;padding:0 12px;font-size:.78rem;color:var(--indigo)}

/* ---------- Onglets ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:4px;justify-content:space-around;
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;max-width:120px;border:none;background:transparent;border-radius:14px;padding:7px 2px;cursor:pointer;
  color:var(--muted);font-weight:800;font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button i{font-style:normal;font-size:1.3rem;line-height:1}
@media (max-width:420px){.nav{gap:1px;padding-left:2px;padding-right:2px}.nav button{font-size:.56rem;padding:7px 0;letter-spacing:-.01em}.nav button i{font-size:1.15rem}}
.nav{transform:translateZ(0);-webkit-transform:translateZ(0)}
body.clavier .nav{display:none}
.nav button.on{color:#fff;background:linear-gradient(135deg,#f59e0b,#fb7185);box-shadow:0 6px 16px rgba(251,113,133,.35)}
@media (min-width:900px){
  body{padding-bottom:40px}
  .nav{position:static;margin:0 0 18px;border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--sh);background:var(--card)}
  .nav button{flex-direction:row;justify-content:center;gap:8px;font-size:.92rem;padding:12px;max-width:none}
  .nav button i{font-size:1.1rem}
}

/* ---------- Cartes ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr}
@media (min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);min-width:0}
.panel h2{font-size:1rem;font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:4px}
.panel h2 .ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem;flex:none;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.panel h2 .cnt{margin-left:auto;font-size:.8rem;color:var(--muted)}
.panel .sub{color:var(--muted);font-size:.8rem;font-weight:600;margin-bottom:12px}
.hero{border-radius:var(--r);padding:18px;color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 28px rgba(79,70,229,.18);min-width:0}
.hero .h-lbl{font-weight:800;font-size:.84rem;opacity:.95}
.hero .h-big{font-size:2.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:4px 0 2px}
.hero .h-sub{font-size:.8rem;font-weight:600;opacity:.92}
.k-violet{--g:linear-gradient(135deg,#6366f1,#8b5cf6);background:var(--g)}
.k-sunset{--g:linear-gradient(135deg,#f59e0b,#fb7185);background:var(--g)}
.k-sky{--g:linear-gradient(135deg,#0ea5e9,#2563eb);background:var(--g)}
.k-emerald{--g:linear-gradient(135deg,#10b981,#059669);background:var(--g)}
.k-teal{--g:linear-gradient(135deg,#14b8a6,#0ea5e9);background:var(--g)}
.k-pink{--g:linear-gradient(135deg,#a855f7,#ec4899);background:var(--g)}
.k-gold{--g:linear-gradient(135deg,#f59e0b,#d97706);background:var(--g)}
.k-magenta{--g:linear-gradient(135deg,#7c3aed,#db2777);background:var(--g)}
.mt{margin-top:14px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}

/* Score */
.score-wrap{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.55rem;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:rgba(255,255,255,.2);border-radius:100px;padding:3px 9px;font-size:.72rem;font-weight:800}

/* Prière suivante */
.prow{display:flex;gap:6px;margin-top:12px}
.plig{display:flex;align-items:center;gap:10px;width:100%;border:none;border-radius:14px;padding:11px 12px;margin-top:7px;background:rgba(255,255,255,.16);color:#fff;font:inherit;text-align:left;cursor:pointer}
.plig b{font-size:1.02rem;min-width:84px}.plig .ph{font-weight:700;opacity:.95;flex:1}.plig .pst{font-size:.78rem;font-weight:800;border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.22);white-space:nowrap}
.plig.done{background:#fff;color:var(--emerald-d)}.plig.done .pst{background:#d1fae5}.plig.late{background:#fde68a;color:#92400e}.plig.late .pst{background:#fef3c7}
.plig.miss{background:rgba(0,0,0,.18)}.plig.next{outline:3px solid #facc15}.plig.sun{background:transparent;padding:2px 12px;margin-top:4px;cursor:default;font-size:.8rem;opacity:.85}
.prow.big .pmini{padding:11px 2px;font-size:.82rem;border-radius:14px}.prow.big .pmini small{font-size:.74rem;margin-top:2px}
.pmini{flex:1;border-radius:12px;padding:7px 2px;text-align:center;background:rgba(255,255,255,.18);font-size:.68rem;font-weight:800;border:none;color:#fff;cursor:pointer}
.pmini small{display:block;font-weight:600;opacity:.9}
.prow.big .pmini{min-width:0}.prow.big .pmini.sun{font-size:.64rem;letter-spacing:-.02em}.pmini.sun{cursor:default;background:rgba(255,255,255,.1);opacity:.85;font-weight:700}.pmini .iq{font-size:.62rem!important;opacity:.8;margin-top:1px!important}
.pmini.done{background:#fff;color:var(--emerald-d)}
.pmini.late{background:#fde68a;color:#92400e}
.pmini.miss{background:rgba(127,29,29,.45)}
.pmini.next{outline:2px solid #fde047;outline-offset:1px}

/* Compteur cigarettes */
.cig{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.cig .n{font-size:3rem;font-weight:800;line-height:1}
.cig .n small{font-size:1rem;opacity:.85}
.cbtn{width:62px;height:62px;border-radius:20px;border:none;font-size:2rem;font-weight:800;cursor:pointer;display:grid;place-items:center;transition:transform .08s}
.cbtn:active{transform:scale(.92)}
.cbtn.plus{background:#fff;color:#e11d48;box-shadow:0 8px 18px rgba(0,0,0,.15)}
.cbtn.minus{background:rgba(255,255,255,.22);color:#fff;width:48px;height:48px;font-size:1.5rem;border-radius:16px}
.bar{height:9px;background:rgba(255,255,255,.28);border-radius:100px;overflow:hidden;margin-top:10px}
.bar>div{height:100%;border-radius:100px;background:linear-gradient(90deg,#fde047,#fff);transition:width .4s}

/* Tuiles « fait » */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;min-height:96px;box-shadow:var(--sh);transition:transform .1s,box-shadow .15s}
.tile:active{transform:scale(.97)}
.tile .t-ico{font-size:1.6rem;line-height:1}
.tile b{font-size:.92rem;font-weight:800}
.tile small{font-size:.72rem;color:var(--muted);font-weight:600}
.tile.on{color:#fff;border-color:transparent;background:var(--g)}
.tile.on small{color:rgba(255,255,255,.9)}
.tile.on.ptile::after{content:none;display:none}
.tile.on::after{content:"✓ FAIT";font-size:.66rem;font-weight:800;background:rgba(255,255,255,.25);border-radius:100px;padding:2px 8px;align-self:flex-start}
.tile.alt.on::after{content:"✓ REPOS"}
.fruits{display:flex;flex-direction:column;gap:10px;margin-top:12px;border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.fruits.ok{background:color-mix(in srgb,#84cc16 14%,var(--card));border-color:#bef264}
.fruits b{font-size:.92rem;font-weight:800}
.fruits small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.fruits .fr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fruits .fr button{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);font-size:1.25rem;cursor:pointer;filter:grayscale(1);opacity:.45;transition:.12s}
.fruits .fr button.on{filter:none;opacity:1;background:#fff;border-color:#bef264;transform:scale(1.04)}
.fruits.eau .fr{grid-template-columns:repeat(6,1fr)}
.fruits.eau.ok{background:color-mix(in srgb,#0ea5e9 12%,var(--card));border-color:#7dd3fc}
.fruits.eau .fr button.on{border-color:#7dd3fc}
.wbar{height:8px;border-radius:100px;background:var(--card2);overflow:hidden}
.wbar div{height:100%;border-radius:100px;background:linear-gradient(90deg,#38bdf8,#2563eb);transition:width .3s}
/* Boussole Qibla */
.qbtn{position:absolute;top:14px;right:14px;border:none;background:rgba(255,255,255,.22);color:#fff;border-radius:100px;padding:6px 11px;font-weight:800;font-size:.74rem;cursor:pointer}
.compass{position:relative;width:min(270px,76vw);aspect-ratio:1;margin:22px auto 14px}
.dial{position:absolute;inset:0;border-radius:50%;border:2px solid var(--line);box-shadow:var(--sh);
  background:radial-gradient(circle,var(--card) 0 60%,var(--card2) 61% 100%)}
.dial .cp{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;display:grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--muted)}
.dial .cp.n{color:#ef4444}
.dial .tk{position:absolute;left:50%;top:0;width:2px;height:9px;margin-left:-1px;background:var(--line);transform-origin:50% calc(min(270px,76vw)/2)}
.dial .ql{position:absolute;left:50%;bottom:50%;width:6px;margin-left:-3px;height:38%;border-radius:6px;background:linear-gradient(0deg,rgba(16,185,129,.15),#10b981);transform-origin:50% 100%}
.dial .kb{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;display:grid;place-items:center;font-size:1.8rem}
.needle{position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:18px solid var(--indigo);z-index:2}
.compass.ok .needle{border-top-color:#10b981}
.compass.ok .dial{border-color:#10b981;box-shadow:0 0 0 6px rgba(16,185,129,.18)}
.qcenter{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.qcenter b{display:block;font-size:1.6rem;font-weight:800}
.qcenter small{font-size:.72rem;color:var(--muted);font-weight:700}

/* Listes à cocher */
.checks{display:flex;flex-direction:column;gap:7px}
.ck{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;background:var(--card);text-align:left;font-size:.86rem;font-weight:700;width:100%}
.ck .box{width:24px;height:24px;border-radius:8px;border:2px solid #c7d2fe;flex:none;display:grid;place-items:center;font-size:.8rem;color:#fff}
.ck.on{background:color-mix(in srgb,var(--emerald) 10%,var(--card));border-color:#a7f3d0}
.ck.on .box{background:linear-gradient(135deg,#10b981,#059669);border-color:transparent}
.ck.on .box::before{content:"✓"}
.prio{display:flex;gap:8px;align-items:center}
.prio input[type=text]{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card2);border-radius:12px;padding:11px 12px;font-size:.88rem;font-weight:600}
.prio .ck{width:auto;padding:9px}
.prio .ck.on{opacity:1}

/* Citations */
.quote{border-radius:var(--r);padding:20px;color:#fff;box-shadow:0 12px 28px rgba(124,58,237,.2)}

// Preuves : hadith complet de chaque Sunnah du jour (vérifiés dans Al-Boukhari, Muslim, Abou Dâwoud) et verset complet de « Ce qu'Allah aime »
const SUNNAH_SRC=[["Un homme demanda au Prophète ﷺ : « Quelle est la meilleure pratique de l'islam ? » Il répondit : « Que tu nourrisses les gens et que tu salues ceux que tu connais et ceux que tu ne connais pas. »", "Al-Boukhari n° 12, d'après ʿAbdallah ibn ʿAmr"], ["« Ne méprise aucune bonne action, même le fait d'accueillir ton frère avec un visage souriant. »", "Muslim n° 2626, d'après Abou Dharr"], ["« Quand l'homme meurt, ses œuvres s'arrêtent, sauf trois : une aumône continue, une science dont on tire profit, ou un enfant vertueux qui invoque pour lui. »", "Muslim n° 1631, d'après Abou Hourayra"], ["Un homme demanda au Prophète ﷺ : « Quelle est la meilleure pratique de l'islam ? » Il répondit : « Que tu nourrisses les gens et que tu salues ceux que tu connais et ceux que tu ne connais pas. »", "Al-Boukhari n° 12, d'après ʿAbdallah ibn ʿAmr"], ["« Alors qu'un homme marchait sur un chemin, il trouva une branche épineuse au milieu du passage et l'écarta. Allah lui en fut reconnaissant et lui pardonna. »", "Muslim n° 1914, d'après Abou Hourayra"], ["« N'est pas menteur celui qui réconcilie les gens en rapportant du bien ou en disant de bonnes paroles. »", "Al-Boukhari n° 2692, d'après Oumm Koulthoum bint ʿOuqba"], ["Le Prophète ﷺ dit à ʿOmar ibn Abî Salama, enfant : « Mon garçon ! Mentionne le nom d'Allah, mange de ta main droite et mange de ce qui est devant toi. » Et il a dit : « Allah est satisfait de Son serviteur qui mange une bouchée et L'en loue, ou qui boit une gorgée et L'en loue. »", "Al-Boukhari n° 5376 et Muslim n° 2734"], ["Abou Hourayra a dit : « Mon ami intime (le Prophète ﷺ) m'a recommandé trois choses : jeûner trois jours par mois, prier les deux rakʿa du Douhâ, et prier le witr avant de dormir. »", "Al-Boukhari n° 1981, d'après Abou Hourayra"], ["Abou Hourayra a dit : « Mon ami intime (le Prophète ﷺ) m'a recommandé trois choses : jeûner trois jours par mois, prier les deux rakʿa du Douhâ, et prier le witr avant de dormir. »", "Al-Boukhari n° 1981, d'après Abou Hourayra"], ["« Celui qui, après chaque prière, glorifie Allah 33 fois (Soubhân Allâh), Le loue 33 fois (Al-hamdou lillâh) et proclame Sa grandeur 33 fois (Allâhou akbar), soit 99, puis complète la centaine en disant : Lâ ilâha illa-llâhou wahdahou lâ charîka lah, lahou-l-moulkou wa lahou-l-hamd, wa houwa ʿalâ koulli chay'in qadîr, ses péchés lui sont pardonnés, même s'ils étaient comme l'écume de la mer. »", "Muslim n° 597, d'après Abou Hourayra"], ["« Nourrissez celui qui a faim, rendez visite au malade et libérez le captif. »", "Al-Boukhari n° 5649, d'après Abou Moûsâ Al-Achʿari"], ["« L'aumône ne diminue en rien les biens. Personne ne pardonne sans qu'Allah n'augmente son honneur, et personne ne se fait humble pour Allah sans qu'Allah ne l'élève. »", "Muslim n° 2588, d'après Abou Hourayra"], ["« Qu'Allah fasse miséricorde à celui qui est facile quand il vend, quand il achète et quand il réclame son dû. »", "Al-Boukhari n° 2076, d'après Jâbir ibn ʿAbdillah"], ["« Protégez-vous du Feu, ne serait-ce qu'avec la moitié d'une datte donnée en aumône. »", "Al-Boukhari n° 1417, d'après ʿAdiyy ibn Hâtim"], ["« Il n'est pas un serviteur croyant qui invoque pour son frère en son absence sans que l'ange ne dise : Et pour toi la même chose. »", "Muslim n° 2732, d'après Abou Dharr"], ["On demanda à ʿÂ'icha ce que faisait le Prophète ﷺ chez lui. Elle répondit : « Il se mettait au service de sa famille, et quand venait l'heure de la prière, il sortait pour la prière. »", "Al-Boukhari n° 676, d'après ʿÂ'icha"], ["« Celui qui apprend par cœur les dix premiers versets de la sourate Al-Kahf sera protégé du Dajjâl. »", "Muslim n° 809, d'après Abou Ad-Dardâ'"], ["Le Prophète ﷺ dit à Al-Barâ' : « Quand tu vas te coucher, fais tes ablutions comme pour la prière, puis allonge-toi sur le côté droit et dis : Allâhoumma aslamtou wajhî ilayk… »", "Al-Boukhari n° 247, d'après Al-Barâ' ibn ʿÂzib"], ["« Que celui qui aime que sa subsistance soit élargie et sa vie prolongée entretienne les liens de parenté. »", "Al-Boukhari n° 5986, d'après Anas ibn Mâlik"], ["« Celui qui ne remercie pas les gens ne remercie pas Allah. »", "Abou Dâwoud n° 4811, d'après Abou Hourayra — authentique (sahih)"], ["« Si je ne craignais pas de rendre la chose pénible à ma communauté, je leur aurais ordonné d'utiliser le siwak à chaque prière. »", "Al-Boukhari n° 887, d'après Abou Hourayra"], ["ʿÂ'icha a dit : « Le Prophète ﷺ aimait commencer par la droite pour mettre ses chaussures, se coiffer, se purifier, et dans toutes ses affaires. »", "Al-Boukhari n° 168, d'après ʿÂ'icha"], ["Anas a rapporté que le Prophète ﷺ respirait trois fois en buvant (hors du récipient) et disait : « C'est plus désaltérant, plus sain et plus agréable. »", "Muslim n° 2028, d'après Anas ibn Mâlik"], ["« Quand l'un de vous entre dans une mosquée, qu'il prie deux rakʿa avant de s'asseoir. »", "Al-Boukhari n° 444, d'après Abou Qatâda"], ["« Celui qui, après avoir entendu l'appel, dit : Allâhoumma rabba hâdhihi-d-daʿwati-t-tâmma, wa-s-salâti-l-qâ'ima, âti Mouhammadan al-wasîlata wa-l-fadîla, wa-bʿath-hou maqâman mahmoûdan-il-ladhî waʿadtah, mon intercession lui sera acquise le Jour de la Résurrection. »", "Al-Boukhari n° 614, d'après Jâbir ibn ʿAbdillah"], ["« Celui qui prie sur moi une fois, Allah prie sur lui dix fois. »", "Muslim n° 408, d'après Abou Hourayra"], ["À Abou Hourayra, on enseigna : « Quand tu vas te coucher, récite Âyat al-Koursî jusqu'à la fin du verset : Allah placera sur toi un gardien et aucun diable ne t'approchera jusqu'au matin. » Le Prophète ﷺ confirma : « Il t'a dit la vérité. »", "Al-Boukhari n° 2311, d'après Abou Hourayra"], ["ʿÂ'icha a dit : « Chaque nuit, en se couchant, le Prophète ﷺ joignait ses mains, soufflait dedans après avoir récité Al-Ikhlâs, Al-Falaq et An-Nâs, puis les passait sur ce qu'il pouvait de son corps. Il le faisait trois fois. »", "Al-Boukhari n° 5017, d'après ʿÂ'icha"], ["Interrogé sur le jeûne du lundi, le Prophète ﷺ a dit : « C'est le jour où je suis né et le jour où la révélation est descendue sur moi. »", "Muslim n° 1162, d'après Abou Qatâda"], ["« Celui qui dit cent fois par jour Soubhâna-llâhi wa bihamdih, ses péchés lui sont pardonnés, même s'ils étaient comme l'écume de la mer. »", "Al-Boukhari n° 6405, d'après Abou Hourayra"], ["« Celui qui se lave le vendredi, se purifie autant qu'il peut, se parfume, puis se rend à la prière sans séparer deux personnes assises, prie ce qui lui a été prescrit puis écoute l'imam en silence, ses péchés entre ce vendredi et le précédent lui sont pardonnés. »", "Al-Boukhari n° 883, d'après Salmân Al-Fârisi"]];
const VERSETS_AIME={"2:195": {"ar": "وَأَنفِقُوا۟ فِى سَبِيلِ ٱللَّهِ وَلَا تُلْقُوا۟ بِأَيْدِيكُمْ إِلَى ٱلتَّهْلُكَةِ ۛ وَأَحْسِنُوٓا۟ ۛ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُحْسِنِينَ", "fr": "Et dépensez dans le sentier d'Allah. Et ne vous jetez pas par vos propres mains dans la destruction. Et faites le bien. Car Allah aime les bienfaisants."}, "2:222": {"ar": "وَيَسْـَٔلُونَكَ عَنِ ٱلْمَحِيضِ ۖ قُلْ هُوَ أَذًۭى فَٱعْتَزِلُوا۟ ٱلنِّسَآءَ فِى ٱلْمَحِيضِ ۖ وَلَا تَقْرَبُوهُنَّ حَتَّىٰ يَطْهُرْنَ ۖ فَإِذَا تَطَهَّرْنَ فَأْتُوهُنَّ مِنْ حَيْثُ أَمَرَكُمُ ٱللَّهُ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلتَّوَّٰبِينَ وَيُحِبُّ ٱلْمُتَطَهِّرِينَ", "fr": "- Et ils t'interrogent sur la menstruation des femmes. - Dis: «C'est un mal. Eloignez-vous donc des femmes pendant les menstrues, et ne les approchez que quand elles sont pures. Quand elles se sont purifiées, alors cohabitez avec elles suivant les prescriptions d'Allah car Allah aime ceux qui se repentent, et Il aime ceux qui se purifient»."}, "3:76": {"ar": "بَلَىٰ مَنْ أَوْفَىٰ بِعَهْدِهِۦ وَٱتَّقَىٰ فَإِنَّ ٱللَّهَ يُحِبُّ ٱلْمُتَّقِينَ", "fr": "Au contraire, quiconque remplit sa promesse et craint Allah... Allah aime les pieux."}, "3:134": {"ar": "ٱلَّذِينَ يُنفِقُونَ فِى ٱلسَّرَّآءِ وَٱلضَّرَّآءِ وَٱلْكَٰظِمِينَ ٱلْغَيْظَ وَٱلْعَافِينَ عَنِ ٱلنَّاسِ ۗ وَٱللَّهُ يُحِبُّ ٱلْمُحْسِنِينَ", "fr": "qui dépensent dans l'aisance et dans l'adversité, qui dominent leur rage et pardonnent à autrui - car Allah aime les bienfaisants -"}, "3:146": {"ar": "وَكَأَيِّن مِّن نَّبِىٍّۢ قَٰتَلَ مَعَهُۥ رِبِّيُّونَ كَثِيرٌۭ فَمَا وَهَنُوا۟ لِمَآ أَصَابَهُمْ فِى سَبِيلِ ٱللَّهِ وَمَا ضَعُفُوا۟ وَمَا ٱسْتَكَانُوا۟ ۗ وَٱللَّهُ يُحِبُّ ٱلصَّٰبِرِينَ", "fr": "Combien de prophètes ont combattu, en compagnie de beaucoup de disciples, ceux-ci ne fléchirent pas à cause de ce qui les atteignit dans le sentier d'Allah. Ils ne faiblirent pas et ils ne cédèrent point. Et Allah aime les endurants."}, "3:159": {"ar": "فَبِمَا رَحْمَةٍۢ مِّنَ ٱللَّهِ لِنتَ لَهُمْ ۖ وَلَوْ كُنتَ فَظًّا غَلِيظَ ٱلْقَلْبِ لَٱنفَضُّوا۟ مِنْ حَوْلِكَ ۖ فَٱعْفُ عَنْهُمْ وَٱسْتَغْفِرْ لَهُمْ وَشَاوِرْهُمْ فِى ٱلْأَمْرِ ۖ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى ٱللَّهِ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُتَوَكِّلِينَ", "fr": "C'est par quelque miséricorde de la part d'Allah que tu (Muhammad) as été si doux envers eux! Mais si tu étais rude, au cœur dur, ils se seraient enfuis de ton entourage. Pardonne-leur donc, et implore pour eux le pardon (d'Allah). Et consulte-les à propos des affaires; puis une fois que tu t'es décidé, confie-toi donc à Allah, Allah aime, en vérité, ceux qui Lui font confiance."}, "3:31": {"ar": "قُلْ إِن كُنتُمْ تُحِبُّونَ ٱللَّهَ فَٱتَّبِعُونِى يُحْبِبْكُمُ ٱللَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ ۗ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ", "fr": "Dis: «Si vous aimez vraiment Allah, suivez-moi, Allah vous aimera alors et vous pardonnera vos péchés. Allah est Pardonneur et Miséricordieux."}, "5:13": {"ar": "فَبِمَا نَقْضِهِم مِّيثَٰقَهُمْ لَعَنَّٰهُمْ وَجَعَلْنَا قُلُوبَهُمْ قَٰسِيَةًۭ ۖ يُحَرِّفُونَ ٱلْكَلِمَ عَن مَّوَاضِعِهِۦ ۙ وَنَسُوا۟ حَظًّۭا مِّمَّا ذُكِّرُوا۟ بِهِۦ ۚ وَلَا تَزَالُ تَطَّلِعُ عَلَىٰ خَآئِنَةٍۢ مِّنْهُمْ إِلَّا قَلِيلًۭا مِّنْهُمْ ۖ فَٱعْفُ عَنْهُمْ وَٱصْفَحْ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُحْسِنِينَ", "fr": "Et puis, à cause de leur violation de l'engagement, Nous les avons maudits et endurci leurs cœurs: ils détournent les paroles de leur sens et oublient une partie de ce qui leur a été rappelé. Tu ne cesseras de découvrir leur trahison, sauf d'un petit nombre d'entre eux. Pardonne-leur donc et oublie [leurs fautes]. Car Allah aime, certes, les bienfaisants."}, "5:42": {"ar": "سَمَّٰعُونَ لِلْكَذِبِ أَكَّٰلُونَ لِلسُّحْتِ ۚ فَإِن جَآءُوكَ فَٱحْكُم بَيْنَهُمْ أَوْ أَعْرِضْ عَنْهُمْ ۖ وَإِن تُعْرِضْ عَنْهُمْ فَلَن يَضُرُّوكَ شَيْـًۭٔا ۖ وَإِنْ حَكَمْتَ فَٱحْكُم بَيْنَهُم بِٱلْقِسْطِ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُقْسِطِينَ", "fr": "Ils sont attentifs au mensonge et voraces de gains illicites. S'ils viennent à toi, sois juge entre eux ou détourne toi d'eux. Et si tu te détournes d'eux, jamais ils ne pourront te faire aucun mal. Et si tu juges, alors juge entre eux en équité. Car Allah aime ceux qui jugent équitablement."}, "9:108": {"ar": "لَا تَقُمْ فِيهِ أَبَدًۭا ۚ لَّمَسْجِدٌ أُسِّسَ عَلَى ٱلتَّقْوَىٰ مِنْ أَوَّلِ يَوْمٍ أَحَقُّ أَن تَقُومَ فِيهِ ۚ فِيهِ رِجَالٌۭ يُحِبُّونَ أَن يَتَطَهَّرُوا۟ ۚ وَٱللَّهُ يُحِبُّ ٱلْمُطَّهِّرِينَ", "fr": "Ne te tiens jamais dans (cette mosquée). Car une Mosquée fondée dès le premier jour, sur la piété, est plus digne que tu t'y tiennes debout [pour y prier]. On y trouve des gens qui aiment bien se purifier, et Allah aime ceux qui se purifient."}, "49:9": {"ar": "وَإِن طَآئِفَتَانِ مِنَ ٱلْمُؤْمِنِينَ ٱقْتَتَلُوا۟ فَأَصْلِحُوا۟ بَيْنَهُمَا ۖ فَإِنۢ بَغَتْ إِحْدَىٰهُمَا عَلَى ٱلْأُخْرَىٰ فَقَٰتِلُوا۟ ٱلَّتِى تَبْغِى حَتَّىٰ تَفِىٓءَ إِلَىٰٓ أَمْرِ ٱللَّهِ ۚ فَإِن فَآءَتْ فَأَصْلِحُوا۟ بَيْنَهُمَا بِٱلْعَدْلِ وَأَقْسِطُوٓا۟ ۖ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُقْسِطِينَ", "fr": "Et si deux groupes de croyants se combattent, faites la conciliation entre eux. Si l'un d'eux se rebelle contre l'autre, combattez le groupe qui se rebelle, jusqu'à ce qu'il se conforme à l'ordre d'Allah. Puis, s'il s'y conforme, réconciliez-les avec justice et soyez équitables car Allah aime les équitables."}, "60:8": {"ar": "لَّا يَنْهَىٰكُمُ ٱللَّهُ عَنِ ٱلَّذِينَ لَمْ يُقَٰتِلُوكُمْ فِى ٱلدِّينِ وَلَمْ يُخْرِجُوكُم مِّن دِيَٰرِكُمْ أَن تَبَرُّوهُمْ وَتُقْسِطُوٓا۟ إِلَيْهِمْ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُقْسِطِينَ", "fr": "Allah ne vous défend pas d'être bienfaisants et équitables envers ceux qui ne vous ont pas combattus pour la religion et ne vous ont pas chassés de vos demeures. Car Allah aime les équitables."}, "3:148": {"ar": "فَـَٔاتَىٰهُمُ ٱللَّهُ ثَوَابَ ٱلدُّنْيَا وَحُسْنَ ثَوَابِ ٱلْءَاخِرَةِ ۗ وَٱللَّهُ يُحِبُّ ٱلْمُحْسِنِينَ", "fr": "Allah, donc, leur donna la récompense d'ici-bas, ainsi que la belle récompense de l'au-delà. Et Allah aime les gens bienfaisants."}, "5:93": {"ar": "لَيْسَ عَلَى ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ جُنَاحٌۭ فِيمَا طَعِمُوٓا۟ إِذَا مَا ٱتَّقَوا۟ وَّءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ ثُمَّ ٱتَّقَوا۟ وَّءَامَنُوا۟ ثُمَّ ٱتَّقَوا۟ وَّأَحْسَنُوا۟ ۗ وَٱللَّهُ يُحِبُّ ٱلْمُحْسِنِينَ", "fr": "Ce n'est pas un péché pour ceux qui ont la foi et font de bonnes œuvres en ce qu'ils ont consommé (du vin et des gains des jeux de hasard avant leur prohibition) pourvu qu'ils soient pieux (en évitant les choses interdites après en avoir eu connaissance) et qu'ils croient (en acceptant leur prohibition) et qu'ils fassent de bonnes œuvres; puis qui (continuent) d'être pieux et de croire et qui (demeurent) pieux et bienfaisants. Car Allah aime les bienfaisants."}, "9:4": {"ar": "إِلَّا ٱلَّذِينَ عَٰهَدتُّم مِّنَ ٱلْمُشْرِكِينَ ثُمَّ لَمْ يَنقُصُوكُمْ شَيْـًۭٔا وَلَمْ يُظَٰهِرُوا۟ عَلَيْكُمْ أَحَدًۭا فَأَتِمُّوٓا۟ إِلَيْهِمْ عَهْدَهُمْ إِلَىٰ مُدَّتِهِمْ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُتَّقِينَ", "fr": "A l'exception des associateurs avec lesquels vous avez conclu un pacte, puis ils ne vous ont manqué en rien, et n'ont soutenu personne [à lutter] contre vous: respectez pleinement le pacte conclu avec eux jusqu'au terme convenu. Allah aime les pieux."}, "9:7": {"ar": "كَيْفَ يَكُونُ لِلْمُشْرِكِينَ عَهْدٌ عِندَ ٱللَّهِ وَعِندَ رَسُولِهِۦٓ إِلَّا ٱلَّذِينَ عَٰهَدتُّمْ عِندَ ٱلْمَسْجِدِ ٱلْحَرَامِ ۖ فَمَا ٱسْتَقَٰمُوا۟ لَكُمْ فَٱسْتَقِيمُوا۟ لَهُمْ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُتَّقِينَ", "fr": "Comment y aurait-il pour les associateurs un pacte admis par Allah et par Son messager? A l'exception de ceux avec lesquels vous avez conclu un pacte près de la Mosquée sacrée. Tant qu'ils sont droits envers vous, soyez droits envers eux. Car Allah aime les pieux."}, "5:54": {"ar": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ مَن يَرْتَدَّ مِنكُمْ عَن دِينِهِۦ فَسَوْفَ يَأْتِى ٱللَّهُ بِقَوْمٍۢ يُحِبُّهُمْ وَيُحِبُّونَهُۥٓ أَذِلَّةٍ عَلَى ٱلْمُؤْمِنِينَ أَعِزَّةٍ عَلَى ٱلْكَٰفِرِينَ يُجَٰهِدُونَ فِى سَبِيلِ ٱللَّهِ وَلَا يَخَافُونَ لَوْمَةَ لَآئِمٍۢ ۚ ذَٰلِكَ فَضْلُ ٱللَّهِ يُؤْتِيهِ مَن يَشَآءُ ۚ وَٱللَّهُ وَٰسِعٌ عَلِيمٌ", "fr": "O les croyants! Quiconque parmi vous apostasie de sa religion... Allah va faire venir un peuple qu'Il aime et qui L'aime, modeste envers les croyants et fier et puissant envers les mécréants, qui lutte dans le sentier d'Allah, ne craignant le blâme d'aucun blâmeur. Telle est la grâce d'Allah. Il la donne à qui Il veut. Allah est Immense et Omniscient."}};
// Hadiths du jour : texte COMPLET des 30 qui sont des extraits (relus sur sunnah.com, arabe à l'appui, le 25/10/2026)
const HADITHS_COMPLET={"0": "'Omar ibn al-Khattab a dit, du haut du minbar : j'ai entendu le Messager d'Allah ﷺ dire : « Les actions ne valent que par les intentions, et chacun n'aura que ce qu'il a eu l'intention de faire. Celui dont l'émigration était pour Allah et Son Messager, son émigration est pour Allah et Son Messager ; et celui dont l'émigration était pour un bien de ce monde qu'il veut obtenir ou pour une femme qu'il veut épouser, son émigration est pour ce vers quoi il a émigré. »", "2": "Le Messager d'Allah ﷺ a dit : « Que celui qui croit en Allah et au Jour dernier dise du bien ou se taise ; que celui qui croit en Allah et au Jour dernier honore son voisin ; et que celui qui croit en Allah et au Jour dernier honore son invité. »", "4": "Le Messager d'Allah ﷺ a dit : « Visez juste et rapprochez-vous (du bien, sans excès), et sachez que nul d'entre vous n'entrera au Paradis par ses œuvres, et que les œuvres les plus aimées d'Allah sont les plus régulières, même si elles sont modestes. »", "5": "Le Messager d'Allah ﷺ a dit : « Chaque articulation de l'homme doit une aumône chaque jour où le soleil se lève : être équitable entre deux personnes est une aumône, aider un homme à monter sur sa monture ou à y charger ses affaires est une aumône, la bonne parole est une aumône, chaque pas vers la prière est une aumône, et écarter ce qui nuit du chemin est une aumône. »", "7": "Le Messager d'Allah ﷺ a dit : « L'aumône ne diminue en rien les biens. Allah n'accorde au serviteur qui pardonne qu'un surcroît d'honneur, et nul ne se fait humble pour Allah sans qu'Allah ne l'élève. »", "10": "Le Messager d'Allah ﷺ a dit : « Lisez le Coran, car il viendra le Jour de la Résurrection intercéder en faveur de ceux qui le lisaient. Lisez les deux lumineuses : al-Baqara et la sourate Âl 'Imrân, car elles viendront le Jour de la Résurrection comme deux nuages, ou comme deux ombrages, ou comme deux nuées d'oiseaux en rangs, plaidant en faveur de ceux qui les lisaient. Lisez la sourate al-Baqara, car la prendre est une bénédiction, la délaisser est un regret, et les magiciens (al-batala) ne peuvent rien contre elle. »", "11": "Le Messager d'Allah ﷺ a dit : « La purification est la moitié de la foi. « Al-hamdou lillah » (la louange est à Allah) remplit la balance. « SoubhanAllah » et « al-hamdou lillah » remplissent ce qui est entre les cieux et la terre. La prière est une lumière, l'aumône est une preuve, la patience est une clarté, et le Coran est un argument pour toi ou contre toi. Chaque personne part le matin et vend son âme : soit elle l'affranchit, soit elle la mène à sa perte. »", "12": "Le Messager d'Allah ﷺ a dit : « Celui qui soulage un croyant d'une détresse parmi les détresses de ce monde, Allah le soulagera d'une détresse parmi les détresses du Jour de la Résurrection. Celui qui facilite les choses à une personne en difficulté, Allah lui facilitera les choses dans ce monde et dans l'au-delà. Celui qui couvre un musulman, Allah le couvrira dans ce monde et dans l'au-delà. Allah vient en aide au serviteur tant que le serviteur vient en aide à son frère. Celui qui emprunte un chemin à la recherche d'une science, Allah lui facilite par cela un chemin vers le Paradis. Aucun groupe ne se réunit dans une maison parmi les maisons d'Allah, récitant le Livre d'Allah et l'étudiant ensemble, sans que la sérénité ne descende sur eux, que la miséricorde ne les enveloppe, que les anges ne les entourent et qu'Allah ne les mentionne auprès de ceux qui sont auprès de Lui. Et celui que ses œuvres ont retardé, sa lignée ne le fera pas avancer. »", "14": "Le Messager d'Allah ﷺ a dit : « Le croyant fort est meilleur et plus aimé d'Allah que le croyant faible, et en chacun il y a du bien. Attache-toi à ce qui t'est utile, demande l'aide d'Allah et ne baisse pas les bras. Et si quelque chose t'arrive, ne dis pas : « Si j'avais fait ceci, il en aurait été ainsi et ainsi », mais dis : « C'est le décret d'Allah, et ce qu'Il a voulu, Il l'a fait », car le « si » ouvre la porte à l'œuvre du Chaytan. »", "20": "Le Messager d'Allah ﷺ a dit : « Si une rivière coulait à la porte de l'un de vous et qu'il s'y lavait cinq fois par jour, lui resterait-il la moindre saleté ? » Ils répondirent : « Il ne lui resterait aucune saleté. » Il dit : « Tel est l'exemple des cinq prières : par elles, Allah efface les péchés. »", "22": "Le Messager d'Allah ﷺ a dit : « Celui qui prie le Fajr est sous la protection d'Allah. Qu'Allah ne vous réclame donc rien de ce qui relève de Sa protection, car Il le rattraperait et le jetterait face contre terre dans le feu de l'Enfer. »", "27": "Abou Chourayh a dit : mes oreilles ont entendu et mes yeux ont vu le Prophète ﷺ quand il a dit : « Que celui qui croit en Allah et au Jour dernier honore son voisin, et que celui qui croit en Allah et au Jour dernier honore son invité en lui donnant son dû. » On demanda : « Et quel est son dû, ô Messager d'Allah ? » Il répondit : « Un jour et une nuit. L'hospitalité dure trois jours, et ce qui va au-delà est une aumône qu'on lui fait. Et que celui qui croit en Allah et au Jour dernier dise du bien ou se taise. »", "30": "Le Prophète ﷺ a dit : « Personne n'a jamais mangé de meilleure nourriture que celle qui provient du travail de ses mains. Et le prophète d'Allah Dawoud (David), sur lui la paix, mangeait du travail de ses mains. »", "32": "Le Messager d'Allah ﷺ a dit : « Le vendeur et l'acheteur ont le choix (de maintenir ou d'annuler la vente) tant qu'ils ne se sont pas séparés – ou il a dit : jusqu'à ce qu'ils se séparent. Si le vendeur et l'acheteur sont véridiques et clairs, leur transaction est bénie ; s'ils cachent et mentent, la bénédiction en est retirée. »", "33": "Le Prophète ﷺ a dit : « La véracité mène à la bonté, et la bonté mène au Paradis. Et l'homme ne cesse de dire la vérité jusqu'à devenir un véridique (siddiq). Le mensonge mène à la perversité (al-fujur), et la perversité mène au Feu. Et l'homme ne cesse de mentir jusqu'à être inscrit auprès d'Allah comme un grand menteur. »", "34": "'Aïcha rapporte : « Un groupe de juifs demanda la permission d'entrer chez le Prophète ﷺ et ils dirent : \"As-sâmou 'alayk\" (la mort sur toi). Je dis : \"Que la mort et la malédiction soient plutôt sur vous !\" Il dit : \"Ô 'Aïcha, Allah est Doux et Il aime la douceur en toute chose.\" Je dis : \"N'as-tu pas entendu ce qu'ils ont dit ?\" Il dit : \"J'ai dit : Et sur vous (wa 'alaykoum).\" »", "35": "Le Prophète ﷺ a dit : « Le musulman est celui dont les musulmans sont à l'abri de la langue et de la main, et l'émigré (al-mouhajir) est celui qui délaisse ce qu'Allah a interdit. »", "36": "Le Messager d'Allah ﷺ a dit : « Celui qui soulage un croyant d'une difficulté parmi les difficultés de ce monde, Allah le soulagera d'une difficulté parmi celles du Jour de la Résurrection. Celui qui facilite les choses à une personne en difficulté, Allah lui facilitera les choses dans ce monde et dans l'au-delà. Celui qui couvre (les fautes d')un musulman, Allah le couvrira dans ce monde et dans l'au-delà. Allah aide Son serviteur tant que celui-ci aide son frère. Celui qui emprunte un chemin pour y chercher une science, Allah lui facilite par cela un chemin vers le Paradis. Aucun groupe de gens ne se réunit dans une des maisons d'Allah, récitant le Livre d'Allah et l'étudiant entre eux, sans que la sérénité ne descende sur eux, que la miséricorde ne les recouvre, que les anges ne les entourent et qu'Allah ne les mentionne auprès de ceux qui sont auprès de Lui. Et celui que ses œuvres ont retardé, sa lignée ne le fera pas avancer. »", "39": "Le Prophète ﷺ a dit : « Allah dit : \"Je suis conforme à l'opinion que Mon serviteur a de Moi, et Je suis avec lui lorsqu'il se souvient de Moi. S'il se souvient de Moi en lui-même, Je Me souviens de lui en Moi-même ; s'il se souvient de Moi dans une assemblée, Je Me souviens de lui dans une assemblée meilleure qu'eux. S'il s'approche de Moi d'un empan, Je m'approche de lui d'une coudée ; s'il s'approche de Moi d'une coudée, Je m'approche de lui d'une brasse ; et s'il vient à Moi en marchant, Je viens à lui en courant.\" »", "41": "Le Prophète ﷺ a dit : « N'entrera pas au Paradis celui qui a dans son cœur le poids d'un atome d'orgueil. » Un homme dit : « L'homme aime que son vêtement soit beau et que ses sandales soient belles. » Il dit : « Allah est Beau et Il aime la beauté. L'orgueil, c'est rejeter la vérité et mépriser les gens. »", "42": "Le Messager d'Allah ﷺ a dit : « Ô 'Abdallah, n'ai-je pas été informé que tu jeûnes le jour et que tu passes la nuit en prière ? » Je répondis : « Si, ô Messager d'Allah. » Il dit : « Ne fais pas cela : jeûne et romps le jeûne, prie la nuit et dors. Ton corps a un droit sur toi, tes yeux ont un droit sur toi, et ton épouse a un droit sur toi. »", "44": "Chaddad ibn Aws a dit : « Il y a deux choses que j'ai retenues du Messager d'Allah ﷺ. Il a dit : \"Allah a prescrit l'excellence (al-ihsan) en toute chose. Lorsque vous tuez, tuez de la meilleure manière, et lorsque vous égorgez, égorgez de la meilleure manière : que l'un de vous aiguise sa lame et qu'il épargne (la souffrance à) la bête qu'il égorge.\" »", "45": "Le Messager d'Allah ﷺ a dit : « L'aumône ne diminue en rien les biens. Allah n'accroît un serviteur qui pardonne qu'en honneur. Nul ne s'humilie pour Allah sans qu'Allah ne l'élève. »", "46": "Le Messager d'Allah ﷺ embrassa al-Hassan ibn 'Ali alors qu'al-Aqra' ibn Habis at-Tamimi était assis auprès de lui. Al-Aqra' dit : « J'ai dix enfants et je n'en ai jamais embrassé un seul. » Le Messager d'Allah ﷺ le regarda puis dit : « Celui qui ne fait pas miséricorde, on ne lui fera pas miséricorde. »", "48": "Le Messager d'Allah ﷺ a dit : « Ce qui est licite est clair et ce qui est illicite est clair ; entre les deux, des choses ambiguës que beaucoup de gens ne connaissent pas. Celui qui s'en préserve protège sa religion et son honneur. Et celui qui tombe dans les choses ambiguës est comme le berger qui fait paître (son troupeau) autour d'une zone réservée : il risque fort d'y pénétrer. Certes, chaque roi a une zone réservée, et la zone réservée d'Allah sur Sa terre, ce sont Ses interdits. Certes, il y a dans le corps un morceau de chair : s'il est sain, tout le corps est sain, et s'il est corrompu, tout le corps est corrompu. Certes, c'est le cœur. »", "59": "Le Prophète ﷺ passa près d'une femme qui pleurait auprès d'une tombe. Il lui dit : « Crains Allah et patiente. » Elle répondit : « Éloigne-toi de moi, car tu n'as pas été frappé par mon malheur. » Elle ne l'avait pas reconnu. On lui dit alors que c'était le Prophète ﷺ. Elle se rendit à la porte du Prophète ﷺ, n'y trouva pas de gardiens, et dit : « Je ne t'avais pas reconnu. » Il dit : « La patience, c'est au premier choc. »", "61": "Des gens parmi les Ansar demandèrent [quelque chose] au Messager d'Allah ﷺ et il leur donna ; puis ils lui demandèrent encore et il leur donna, jusqu'à ce que fût épuisé tout ce qu'il possédait. Il dit alors : « Tout bien que j'aurai, je ne vous le cacherai jamais. Quiconque s'efforce de ne rien demander, Allah le préserve [du besoin] ; quiconque cherche à se suffire, Allah l'enrichit. Quiconque s'efforce à la patience, Allah le rend patient ; et nul n'a reçu de don meilleur et plus vaste que la patience. »", "65": "Une femme dit : « Ô Messager d'Allah, j'ai une coépouse ; est-ce un péché pour moi de me targuer, au sujet de mon mari, de ce qu'il ne me donne pas ? » Le Messager d'Allah ﷺ répondit : « Celui qui se targue de ce qu'il n'a pas reçu est comme celui qui porte deux vêtements de fausseté. »", "69": "Un Bédouin rencontra 'Abdallah ibn 'Omar sur la route de La Mecque. 'Abdallah le salua, le fit monter sur l'âne qu'il montait lui-même et lui donna le turban qu'il avait sur la tête. 'Abdallah ibn Dinar, qui l'accompagnait, raconte : « Nous lui dîmes : Qu'Allah te garde dans le bien ! Ce sont des Bédouins, ils se contentent de peu. » 'Abdallah répondit : « Le père de cet homme était un ami cher de 'Omar ibn al-Khattab, et j'ai entendu le Messager d'Allah ﷺ dire : \"La plus haute forme de piété filiale est que l'enfant entretienne les liens avec ceux que son père aimait.\" »", "87": "Les paroles les plus aimées d'Allah sont quatre : Subhân Allah (Gloire à Allah), al-hamdu lillâh (Louange à Allah), lâ ilâha illa Allah (Nulle divinité hormis Allah) et Allâhu akbar (Allah est le plus grand). Peu importe par laquelle tu commences. Et ne nomme pas ton jeune serviteur Yasar, ni Rabah, ni Najih, ni Aflah, car tu demanderais : « Est-il là ? », et s'il n'y est pas, on te répondrait : « Non. » (Samoura ajouta : « Ce ne sont que quatre [noms], ne m'en attribuez pas davantage. »)"};
function hadithPreuve(i){ const x=HADITHS_COMPLET[i]; if(!x||!accOk()) return ''; return `<details class="preuve hd" onclick="event.stopPropagation()"><summary>📜 Lire le hadith en entier</summary><div class="pv-fr">${esc(x)}</div></details>`; }
function sunnahPreuve(i){ const x=SUNNAH_SRC[i]; if(!x) return ''; return `<details class="preuve" onclick="event.stopPropagation()"><summary>📜 Lire le hadith en entier</summary><div class="pv-fr">${esc(x[0])}</div><div class="pv-src">${esc(x[1])}</div></details>`; }
function versetAime(i){ const a=ALLAH_AIME[i]; if(a[4]) return `<details class="preuve" onclick="event.stopPropagation()"><summary>📜 Lire le hadith en entier</summary><div class="pv-fr">${esc(a[4])}</div><div class="pv-src">${esc(a[2])}</div></details>`; const r=(a[2].match(/\d+:\d+/)||[])[0]; const v=VERSETS_AIME[r]; if(!v) return ''; return `<details class="preuve" onclick="event.stopPropagation()"><summary>📖 Lire le verset en entier</summary><div class="pv-ar" dir="rtl" lang="ar">${esc(v.ar)}</div><div class="pv-fr">« ${esc(v.fr)} »</div><div class="pv-src">Coran, ${esc(a[2])} · trad. Hamidullah</div></details>`; }

function weekIdx(k){ const d=S.cfg.tabac.debut; if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d)) return -1; const w=Math.floor(diffDays(d,k)/7); return isNaN(w)?-1:w; }
function weekAvg(w){
  const s=addDays(S.cfg.tabac.debut,w*7); let tot=0,n=0;
  for(let i=0;i<7;i++){ const k=addDays(s,i); const c=cigN(k); if(c!==null && k<today()){ tot+=c; n++; } else if(c!==null && k===today()){ /* journée en cours : ignorée */ } }
  return n?tot/n:null;
}
// Objectif de chaque semaine : on baisse de « pas » si la semaine précédente a tenu l'objectif (+1 de tolérance), sinon on garde le palier
function planTargets(nbWeeks){
  const T=S.cfg.tabac, out=[]; let t=T.base;
  const wNow=weekIdx(today());
  for(let w=0; w<nbWeeks; w++){
    if(w===0) t=Math.max(0,T.base-T.pas);
    else{
      const a = w<=wNow ? weekAvg(w-1) : null;
      const prev=out[w-1].t;
      if(w<=wNow && a!==null && a>prev+1){ t=prev; out[w-1].tenu=false; }
      else{ t=Math.max(0,prev-T.pas); if(w<=wNow && a!==null) out[w-1].tenu=true; }
    }
    out.push({w, t, debut:addDays(T.debut,w*7), avg:w<=wNow?weekAvg(w):null, futur:w>wNow});
  }
  return out;
}
function targetOf(k){
  const w=weekIdx(k); if(w<0) return S.cfg.tabac.base;
  const p=planTargets(w+1); return p[w].t;
}
function firstCigLimit(k){
  const w=Math.max(0,weekIdx(k)); return Math.min(toMin(S.cfg.tabac.premiereBase)+w*S.cfg.tabac.premierePas, 12*60);
}
function arretPrevu(){
  const p=planTargets(60); const z=p.find(x=>x.t===0); return z?z.debut:null;
}
function tabacStats(){
  const T=S.cfg.tabac, t=today(); let evitees=0, jours=0;
  if(weekIdx(t)<0) return {evitees:0, eco:0, jours:0, sans:0};
  for(let k=T.debut; k<t; k=addDays(k,1)){ const c=cigN(k); if(c!==null){ evitees+=Math.max(0,T.base-c); jours++; } } // journées terminées seulement
  let sans=0; for(let k=t; k>=T.debut; k=addDays(k,-1)){ const c=cigN(k); if(c===0) sans++; else if(k===t && c===null) continue; else break; }
  return {evitees, eco:evitees*prixCig(), jours, sans};
}
function avgCig(n,fromK){ let tot=0,c=0; for(let i=1;i<=n;i++){ const k=addDays(fromK||today(),-i); const v=cigN(k); if(v!==null){ tot+=v; c++; } } return c?tot/c:null; }

function scoreOf(k){
  const d=J(k), W=S.cfg.poids, parts=[];
  const pv=PRAYERS.reduce((s,p)=>s+((PSTAT.find(x=>x.k===d.p[p.k])||{v:0}).v),0)/5;
  parts.push(dispOf(k)?{k:'prieres',l:'Prières',f:1,txt:'🌸 dispensée'}:{k:'prieres',l:'Prières',f:pv,txt:`${PRAYERS.filter(p=>['heure','mosquee','retard'].includes(d.p[p.k])).length}/5`});
  const n=d.cig.length, t=targetOf(k);
  const tv = k<S.cfg.tabac.debut ? 0 : (n<=t?1:Math.max(0,1-(n-t)/5));
  if(S.cfg.fumeur) parts.push({k:'tabac',l:'Tabac',f:tv,txt:`${n}/${t}`});
  const ne=essFaits(d), nbE=essNb(); parts.push({k:'essentiels',l:'Mes essentiels',f:ne/nbE,txt:`${ne}/${nbE}`}); // 6 cases au choix, même poids chacune
  const nb=baNb(d);
  parts.push({k:'bonnes',l:'Bonnes actions',f:nb>=1?1:0,txt:nb?`${nb} ✓`:'—'}); // une seule bonne action suffit, les autres sont du bonus
  parts.push({k:'fruits',l:'Fruits',f:Math.min(5,d.fruits||0)/5,txt:`${d.fruits||0}/5`});
  parts.push({k:'eau',l:'Eau',f:Math.min(6,d.eau||0)/6,txt:`${litres(d.eau)} L`});
  const pr=d.prio.filter(p=>p.t.trim()), po=pr.filter(p=>p.ok).length;
  parts.push({k:'business',l:'Business',f:pr.length?po/pr.length:0,txt:`${po}/${pr.length||3}`});
  let tot=0,max=0; parts.forEach(p=>{ p.max=p.k==='essentiels'?(W.essentiels??((+W.sport||0)+(+W.coran||0)+(+W.lecture||0)+(+W.famille||0))):(W[p.k]||0); p.pts=Math.round(p.f*p.max*10)/10; tot+=p.f*p.max; max+=p.max; });
  let score=max?Math.round(tot/max*100):0;
  // Bonus jeûne : +10 points (jeûne surérogatoire ou jour de Ramadan jeûné), sans pénaliser les jours sans jeûne
  if(d.jeuneNafl||d.jeune==='fait'){ parts.push({k:'jeune',l:'Jeûne',bonus:true,f:1,pts:10,max:0,txt:d.jeune==='fait'?'Ramadan':'surérogatoire'}); score=Math.min(100,score+10); }
  { // istighfar et dhikr : points bonus (pour tous depuis le 22/10)
    if((d.istighfar||0)>=100){ parts.push({k:'istighfar',l:'Istighfar',bonus:true,f:1,pts:PTS_ISTIGHFAR,max:0,txt:'100'}); score=Math.min(100,score+PTS_ISTIGHFAR); }
    if(dhikrFait(d)){ parts.push({k:'dhikr',l:'Dhikr',bonus:true,f:1,pts:PTS_DHIKR,max:0,txt:'fait'}); score=Math.min(100,score+PTS_DHIKR); } }
  return {score, parts};
}

function sportWeek(k){ // séances du lundi au dimanche
  const d=dateOf(k), dow=(d.getDay()+6)%7, lun=addDays(k,-dow); let n=0;
  for(let i=0;i<7;i++){ const x=S.jours[addDays(lun,i)]; if(x&&x.sport) n++; } return n;
}
function streakTxt(){
  let p=0; for(let k=has(today())&&(prayCount(today())===5||dispOf(today()))?today():addDays(today(),-1); (has(k)&&prayCount(k)===5)||dispOf(k); k=addDays(k,-1)){ p++; if(p>3650) break; }

}

function prayerReg(n){
  const r={heure:0,retard:0,manque:0}; let days=0; PRAYERS.forEach(p=>r[p.k]=0);
  for(let i=0;i<n;i++){ const k=addDays(today(),-i); if(k<firstDay()) break; days++; const d=(S.jours[k]||{}).p||{};
    PRAYERS.forEach(p=>{ const s=d[p.k]; if(s==='heure'||s==='mosquee'){ r[p.k]++; r.heure++; } else if(s==='retard'){ r[p.k]++; r.retard++; } else if(i>0||s==='manquee') r.manque++; }); }
  PRAYERS.forEach(p=>r[p.k]=days?Math.round(r[p.k]/days*100):0);
  r.heure=days?Math.round(r.heure/(days*5)*100):0; return r;
}

function coachMsg(){

function toast(msg,ms){ const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),ms||2200); }
function vib(){ try{ navigator.vibrate&&navigator.vibrate(12); }catch(e){} }
function toggle(k){
  const d=J(); d[k]=!d[k]; if(k==='sport'&&d.sport) d.repos=false; vib(); touch(); render();
  if(d[k]) toast({sport:'💪 Séance validée !',coran:'📖 BarakAllahu fik',lecture:'📚 +20 min pour ton cerveau',famille:'❤️ Le meilleur investissement',adhM:'☀️ Protégé pour la journée',adhS:'🌙 Protégé pour la nuit',sunnahOk:'✨ Sunnah accomplie · comptée dans tes bonnes actions',repos:'😴 Repos noté',jeuneNafl:'🍽️ Qu\'Allah accepte ton jeûne · +10 points',aime:'🤍 Qu\'Allah t\'aime et t\'accepte'}[k]||'✓');
}
function cyclePrayer(p){ const order=[undefined,'heure','retard','manquee']; const d=J(); const i=order.indexOf(d.p[p]); setPrayer(p,order[(i+1)%order.length]||null,true); }
function setPrayer(p,s,cyc){ const d=J(), avant=cinqALheure(d); d.p[p]=(!cyc&&d.p[p]===s)?null:s; if(!d.p[p]) delete d.p[p]; vib(); touch(); render();
  if(!avant && cinqALheure(d)) return etoileCinq(); // la 5e prière à l'heure (ou à la mosquée) : croissant puis « ما شاء الله »
  if(d.p[p]==='heure'||d.p[p]==='mosquee') toast(prayCount(S.sel)===5?'🌟 5/5 prières, mashaAllah !':'🕌 Prière notée'); }
const cinqALheure=d=>PRAYERS.every(p=>d.p[p.k]==='heure'||d.p[p.k]==='mosquee'); // à l'heure ou à la mosquée
function etoileCinq(){
  try{ navigator.vibrate&&navigator.vibrate([40,60,40,60,120]); }catch(e){}
  // en deux temps : le croissant apparaît puis s'efface, puis un grand « MachaAllah ! »
  const el=document.createElement('div'); el.className='lune-bg';
  el.innerHTML=`<div class="c">🌙</div><div class="t"><b class="ar" lang="ar" dir="rtl">ما شاء الله</b><i>Mâ châ' Allah</i><small>5 prières à l'heure aujourd'hui 🤲</small></div>`;
  document.body.appendChild(el); setTimeout(()=>el.remove(),3900);
}
function cig(n){
  const d=J();
  if(n>0){
    const isT=S.sel===today(); const now=new Date(); const m=now.getHours()*60+now.getMinutes();
    if(isT && !d.cig.length && m<firstCigLimit(S.sel) && S.sel>=S.cfg.tabac.debut){ return sheetFirst(); }
    addCig();
  } else if(d.cig.length){ d.cig.pop(); touch(); render(); toast('Cigarette retirée'); }
}
function addCig(){
  const d=J(); const isT=S.sel===today();
  d.cig.push(isT?Date.now():dateOf(S.sel).getTime()+12*36e5+d.cig.length*6e4);
  vib(); touch(); closeSheet(); render();
  const t=targetOf(S.sel), n=d.cig.length;
  toast(n===t?`⚠️ C'était ta dernière de la journée (${t})`:n>t?`${n-t} au-dessus de l'objectif — la prochaine envie, on la bat ensemble`:`Notée. Il t'en reste ${t-n} pour aujourd'hui`,2800);
}
function sheetFirst(){
  openSheet(`<h3>⏰ C'est avant ton heure</h3>
    <p class="muted" style="font-weight:600;font-size:.9rem;margin-bottom:14px">Ta première cigarette est prévue après <b>${hm(firstCigLimit(S.sel))}</b> cette semaine. Tenir 10 minutes, c'est souvent suffisant pour que l'envie passe.</p>
    <div class="row" style="flex-wrap:wrap"><button class="btn green" onclick="closeSheet();envie()">💪 Je tiens 10 minutes</button><button class="btn" onclick="addCig()">Je fume quand même</button></div>`);
}
let envieTimer=null;
function envie(){
  S.envieFin=Date.now()+10*60e3;
  const tips=[...TIPS_ENVIE].sort(()=>Math.random()-.5).slice(0,4);
  openSheet(`<h3>😤 Une envie, ça passe</h3>
    <div class="hero k-sunset" style="text-align:center;margin:10px 0"><div class="h-big tnum" id="envieT">10:00</div><div class="h-sub">Tiens jusqu'à zéro. Respire.</div></div>
    <div class="checks">${tips.map(t=>`<div class="ck"><span class="box" style="border-color:#fbbf24"></span>${esc(t)}</div>`).join('')}</div>
    <p class="muted" style="font-size:.8rem;font-weight:600;margin:12px 0">« Le Paradis est entouré de choses pénibles » (Al-Bukhari n° 6487 et Muslim n° 2822). Ce petit effort compte.</p>
    <div class="row" style="flex-wrap:wrap"><button class="btn green" onclick="envieOk()">✅ L'envie est passée</button><button class="btn" onclick="closeSheet()">Fermer</button></div>`);
  clearInterval(envieTimer);
  envieTimer=setInterval(()=>{ const el=document.getElementById('envieT'); if(!el){ clearInterval(envieTimer); return; }
    const r=Math.max(0,S.envieFin-Date.now()); el.textContent=`${pad(Math.floor(r/60000))}:${pad(Math.floor(r/1000)%60)}`;
    if(!r){ clearInterval(envieTimer); el.textContent='🎉 Gagné'; } },500);
}
function envieOk(){ const d=J(); d.envies=(d.envies||0)+1; touch(); closeSheet(); render(); toast('💪 Envie surmontée — c\'est comme ça qu\'on gagne'); }
function fruit(n){ const d=J(); d.fruits=(d.fruits||0)===n?n-1:n; vib(); touch(); render(); if(d.fruits===5) toast('🍎 5 fruits & légumes, ton corps te dit merci'); }
function eau(n){ const d=J(); d.eau=(d.eau||0)===n?n-1:n; vib(); touch(); render(); if(d.eau===6) toast('💧 1,5 L bu, bravo !'); }
const litres=n=>((n||0)*0.25).toFixed(2).replace(/0$/,'').replace('.',',');
// ✍️ Bonnes actions ajoutées à la main (en plus des 9 du jour)
const baNb=d=>(d.ba||[]).filter(Boolean).length+(d.baPerso||[]).filter(x=>x.ok).length+(d.sunnahOk?1:0)+(d.quiz&&d.quiz.fin?1:0); // la Sunnah du jour compte comme une bonne action
const bas=t=>String(t).trim().toLowerCase();
// liste affichée : ma liste permanente + celles cochées ce jour-là qui n'y sont plus
function baPAffiche(d){ const L=[...(S.cfg.baPersoListe||[])]; for(const x of (d.baPerso||[])) if(x.ok && !L.some(t=>bas(t)===bas(x.t))) L.push(x.t); return L; }
const baPFait=(d,t)=>(d.baPerso||[]).some(x=>x.ok&&bas(x.t)===bas(t));
function baPAjout(t){
  const el=document.getElementById('baPIn'); t=String(t??(el?el.value:'')).trim().slice(0,80); if(!t) return toast('Écris ta bonne action');
  const L=S.cfg.baPersoListe||[];
  if(!L.some(x=>bas(x)===bas(t))){ if(L.length>=30) return toast('30 actions maximum dans ta liste'); S.cfg.baPersoListe=[...L,t]; cfgTouch(); }
  const d=J(); d.baPerso=(d.baPerso||[]).filter(x=>bas(x.t)!==bas(t)); d.baPerso.push({t,ok:true}); vib(); touch(); render();
  toast('🤲 Ajoutée à ta liste et cochée, qu\'Allah accepte');
}
function baPCoche(k){
  const d=J(), t=baPAffiche(d)[k]; if(!t) return;
  const on=baPFait(d,t); d.baPerso=(d.baPerso||[]).filter(x=>bas(x.t)!==bas(t)); if(!on) d.baPerso.push({t,ok:true});
  vib(); touch(); render();
}
function baPOubli(k){
  const t=baPAffiche(J())[k]; if(!t) return;
  if(!confirm(`Retirer « ${t} » de ta liste ?\n(Les jours où tu l'as cochée restent comptés.)`)) return;
  S.cfg.baPersoListe=(S.cfg.baPersoListe||[]).filter(x=>bas(x)!==bas(t)); const d=J(); d.baPerso=(d.baPerso||[]).filter(x=>bas(x.t)!==bas(t)); cfgTouch(); touch(); render();
}
function ba(i){ const d=J(); if(!d.baIds) d.baIds=baJour(S.sel); d.ba[i]=!d.ba[i]; vib(); touch(); render(); if(d.ba[i]&&baNb(d)===9) toast('🌟 9/9 bonnes actions, qu\'Allah accepte'); }

const KAABA=[21.422487,39.826206];

function qiblaBearing(lat,lon){
  const p1=rad(lat), p2=rad(KAABA[0]), dl=rad(KAABA[1]-lon);
  return (deg(Math.atan2(Math.sin(dl)*Math.cos(p2), Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl)))+360)%360;
}
function distKaaba(lat,lon){
  const a=Math.sin(rad(KAABA[0]-lat)/2)**2+Math.cos(rad(lat))*Math.cos(rad(KAABA[0]))*Math.sin(rad(KAABA[1]-lon)/2)**2;
  return 6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ---------- Bonnes actions du jour : 9 tirées de BA_POOL, toujours les mêmes pour une date donnée ---------- */
function baJour(k){
  const d=S.jours[k];
  if(d && Array.isArray(d.baIds) && d.baIds.length===9) return d.baIds;  // la liste vue ce jour-là reste figée
  if(d && d.u && !d.baIds && d.ba && d.ba.some(Boolean)) return [26,5,24,11,9,15,33,34,14]; // anciennes journées : équivalents des 9 actions fixes d'origine
  let seed=0; for(const c of k) seed=(seed*31+c.charCodeAt(0))>>>0;
  const idx=BA_POOL.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ seed=(seed*1103515245+12345)>>>0; const j=seed%(i+1); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return idx.slice(0,9);
}
function baCat(k,cat){ const d=S.jours[k]; if(!d||!d.ba) return 0; const ids=baJour(k); return ids.some((id,i)=>d.ba[i]&&BA_POOL[id][2]===cat)?1:0; }

function compter(onglet){

  sb.rpc('niyya_compter',{p_onglet:onglet}).then(()=>{},()=>{});
}
function compterJournee(){ // 1 « actif » par appareil et par jour + mode d'ouverture (icône / navigateur)
  if(!S.uid || !sb || location.hash==='#autotest') return;
  try{
    const icone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
    if(icone && !S.cfg.vuIcone){ S.cfg.vuIcone=true; cfgTouch(); } // noté à chaque ouverture depuis l'icône (pas seulement la 1re du jour)
    const k='nya_actif_'+today(); if(localStorage.getItem(k)) return; localStorage.setItem(k,'1');
    sb.rpc('niyya_compter',{p_onglet:'actif'}).then(()=>{},()=>{});
    sb.rpc('niyya_compter',{p_onglet:icone?'lancement_appli':'lancement_web'}).then(()=>{},()=>{});
  }catch(e){}
}
let _stats=null;
async function chargerStats(){
  const el=document.getElementById('statsBox'); if(el) el.innerHTML='<p class="muted">Chargement…</p>';
  const {data,error}=await sb.rpc('niyya_stats_lire',{p_jours:30});
  _stats=error?{err:error.message}:(data||[]); render();
}
function statsPanel(){
  if(S.email!==ADMIN_EMAIL) return '';
  const N={jour:'🏠 Aujourd\'hui',din:'🕌 Dîn',noms:'📿 99 noms',coran:'📖 Coran',qibla:'🧭 Qibla',tabac:'🚭 Tabac',voyage:'✈️ Voyage',bilan:'📊 Bilan',reglages:'⚙️ Réglages',don:'💚 Don'};
  const body=!_stats?'<button class="btn pri" onclick="chargerStats()">📈 Voir les statistiques</button>'
    : _stats.err?`<p class="muted">Erreur : ${esc(_stats.err)}</p>`
    : !_stats.length?'<p class="muted">Pas encore de visites comptées.</p>'
    : `<div class="kv" style="font-weight:800"><span>Onglet</span><span>Aujourd'hui · 7 j · 30 j</span></div>${_stats.map(r=>`<div class="kv"><span>${esc(N[r.onglet]||r.onglet)}</span><b class="tnum">${r.aujourdhui} · ${r.sept_jours} · ${r.total}</b></div>`).join('')}
       <button class="btn sm mt" onclick="chargerStats()">🔄 Actualiser</button>`;
  return `<div class="panel mt"><h2><span class="ico">📈</span>Statistiques d'utilisation<span class="cnt">admin</span></h2>
    <div class="sub">Ouvertures d'onglets, tous utilisateurs confondus, anonymes (une ouverture comptée au plus toutes les 10 min par personne et par onglet).</div>
    <div id="statsBox">${body}</div>
    <a class="btn pri" style="display:inline-block;margin-top:12px;text-decoration:none" href="admin.html">🗂️ Ouvrir le back-office complet</a></div>`;
}
