<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NIYYA">
<meta name="theme-color" content="#6366f1">
<link rel="apple-touch-icon" href="niyya-icon-180.png">
<link rel="icon" type="image/png" href="niyya-icon-180.png">
<link rel="manifest" href="manifest.json">
<title>NIYYA — Foi, discipline, réussite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Amiri:wght@700&family=Amiri+Quran&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><!-- non bloquant : si Google est inaccessible (Chine…), l'appli s'affiche quand même -->
<style>
:root{
  --bg1:#eef2ff; --bg2:#faf5ff; --card:#ffffff; --card2:#f8f7ff;
  --ink:#0f172a; --muted:#64748b; --line:#e9e7f5;
  --indigo:#6366f1; --violet:#8b5cf6; --emerald:#10b981; --emerald-d:#047857;
  --amber:#f59e0b; --rose:#fb7185; --red:#ef4444;
  --halo1:#e0e7ff; --halo2:#f5e8ff;
  --r:20px; --sh:0 10px 30px rgba(79,70,229,.08);
}
:root[data-theme="dark"]{
  --bg1:#0b1020; --bg2:#130f22; --card:#171b30; --card2:#1d2140;
  --ink:#eceefb; --muted:#9aa3bd; --line:#2a2f4d; --halo1:#1c1f45; --halo2:#2a1740;
  --sh:0 10px 30px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg1:#0b1020; --bg2:#130f22; --card:#171b30; --card2:#1d2140;
    --ink:#eceefb; --muted:#9aa3bd; --line:#2a2f4d; --halo1:#1c1f45; --halo2:#2a1740;
    --sh:0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg1)}
body{
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1000px 500px at 10% -10%,var(--halo1) 0,transparent 55%),
    radial-gradient(900px 500px at 100% 0,var(--halo2) 0,transparent 55%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  min-height:100vh;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));
}
button,input,textarea,select{font-family:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- Entête ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9rem;letter-spacing:.02em;
  background:linear-gradient(135deg,#6366f1,#ec4899);box-shadow:0 8px 18px rgba(99,102,241,.35)}
.brand h1{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand h1 span{background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{color:var(--muted);font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:100px;padding:6px 12px;font-weight:800;font-size:.74rem;white-space:nowrap;border:1px solid}
.pill.ok{background:#ecfdf5;color:var(--emerald-d);border-color:#a7f3d0}
.pill.wait{background:#fffbeb;color:#b45309;border-color:#fde68a}
.pill.off{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* Navigation de date */
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.daynav button{border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;font-size:1rem;font-weight:800;cursor:pointer;box-shadow:var(--sh)}
.daynav button:disabled{opacity:.35}
.daynav .lbl{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:var(--sh)}
.daynav .lbl b{display:block;font-size:.95rem}
.daynav .lbl small{color:var(--muted);font-weight:600;font-size:.74rem}
.daynav .back{width:auto;padding:0 12px;font-size:.78rem;color:var(--indigo)}

/* ---------- Onglets ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:4px;justify-content:space-around;
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;max-width:120px;border:none;background:transparent;border-radius:14px;padding:7px 2px;cursor:pointer;
  color:var(--muted);font-weight:800;font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button i{font-style:normal;font-size:1.3rem;line-height:1}
@media (max-width:420px){.nav{gap:1px;padding-left:2px;padding-right:2px}.nav button{font-size:.56rem;padding:7px 0;letter-spacing:-.01em}.nav button i{font-size:1.15rem}}
.nav{transform:translateZ(0);-webkit-transform:translateZ(0)}
body.clavier .nav{display:none}
.nav button.on{color:#fff;background:linear-gradient(135deg,#f59e0b,#fb7185);box-shadow:0 6px 16px rgba(251,113,133,.35)}
@media (min-width:900px){
  body{padding-bottom:40px}
  .nav{position:static;margin:0 0 18px;border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--sh);background:var(--card)}
  .nav button{flex-direction:row;justify-content:center;gap:8px;font-size:.92rem;padding:12px;max-width:none}
  .nav button i{font-size:1.1rem}
}

/* ---------- Cartes ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr}
@media (min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);min-width:0}
.panel h2{font-size:1rem;font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:4px}
.panel h2 .ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem;flex:none;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.panel h2 .cnt{margin-left:auto;font-size:.8rem;color:var(--muted)}
.panel .sub{color:var(--muted);font-size:.8rem;font-weight:600;margin-bottom:12px}
.hero{border-radius:var(--r);padding:18px;color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 28px rgba(79,70,229,.18);min-width:0}
.hero .h-lbl{font-weight:800;font-size:.84rem;opacity:.95}
.hero .h-big{font-size:2.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:4px 0 2px}
.hero .h-sub{font-size:.8rem;font-weight:600;opacity:.92}
.k-violet{--g:linear-gradient(135deg,#6366f1,#8b5cf6);background:var(--g)}
.k-sunset{--g:linear-gradient(135deg,#f59e0b,#fb7185);background:var(--g)}
.k-sky{--g:linear-gradient(135deg,#0ea5e9,#2563eb);background:var(--g)}
.k-emerald{--g:linear-gradient(135deg,#10b981,#059669);background:var(--g)}
.k-teal{--g:linear-gradient(135deg,#14b8a6,#0ea5e9);background:var(--g)}
.k-pink{--g:linear-gradient(135deg,#a855f7,#ec4899);background:var(--g)}
.k-gold{--g:linear-gradient(135deg,#f59e0b,#d97706);background:var(--g)}
.k-magenta{--g:linear-gradient(135deg,#7c3aed,#db2777);background:var(--g)}
.mt{margin-top:14px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}

/* Score */
.score-wrap{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.55rem;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:rgba(255,255,255,.2);border-radius:100px;padding:3px 9px;font-size:.72rem;font-weight:800}

/* Prière suivante */
.prow{display:flex;gap:6px;margin-top:12px}
.pmini{flex:1;border-radius:12px;padding:7px 2px;text-align:center;background:rgba(255,255,255,.18);font-size:.68rem;font-weight:800;border:none;color:#fff;cursor:pointer}
.pmini small{display:block;font-weight:600;opacity:.9}
.pmini.done{background:#fff;color:var(--emerald-d)}
.pmini.late{background:#fde68a;color:#92400e}
.pmini.miss{background:rgba(127,29,29,.45)}
.pmini.next{outline:2px solid #fde047;outline-offset:1px}

/* Compteur cigarettes */
.cig{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.cig .n{font-size:3rem;font-weight:800;line-height:1}
.cig .n small{font-size:1rem;opacity:.85}
.cbtn{width:62px;height:62px;border-radius:20px;border:none;font-size:2rem;font-weight:800;cursor:pointer;display:grid;place-items:center;transition:transform .08s}
.cbtn:active{transform:scale(.92)}
.cbtn.plus{background:#fff;color:#e11d48;box-shadow:0 8px 18px rgba(0,0,0,.15)}
.cbtn.minus{background:rgba(255,255,255,.22);color:#fff;width:48px;height:48px;font-size:1.5rem;border-radius:16px}
.bar{height:9px;background:rgba(255,255,255,.28);border-radius:100px;overflow:hidden;margin-top:10px}
.bar>div{height:100%;border-radius:100px;background:linear-gradient(90deg,#fde047,#fff);transition:width .4s}

/* Tuiles « fait » */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;min-height:96px;box-shadow:var(--sh);transition:transform .1s,box-shadow .15s}
.tile:active{transform:scale(.97)}
.tile .t-ico{font-size:1.6rem;line-height:1}
.tile b{font-size:.92rem;font-weight:800}
.tile small{font-size:.72rem;color:var(--muted);font-weight:600}
.tile.on{color:#fff;border-color:transparent;background:var(--g)}
.tile.on small{color:rgba(255,255,255,.9)}
.tile.on::after{content:"✓ FAIT";font-size:.66rem;font-weight:800;background:rgba(255,255,255,.25);border-radius:100px;padding:2px 8px;align-self:flex-start}
.tile.alt.on::after{content:"✓ REPOS"}
.fruits{display:flex;flex-direction:column;gap:10px;margin-top:12px;border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.fruits.ok{background:color-mix(in srgb,#84cc16 14%,var(--card));border-color:#bef264}
.fruits b{font-size:.92rem;font-weight:800}
.fruits small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.fruits .fr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fruits .fr button{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);font-size:1.25rem;cursor:pointer;filter:grayscale(1);opacity:.45;transition:.12s}
.fruits .fr button.on{filter:none;opacity:1;background:#fff;border-color:#bef264;transform:scale(1.04)}
.fruits.eau .fr{grid-template-columns:repeat(6,1fr)}
.fruits.eau.ok{background:color-mix(in srgb,#0ea5e9 12%,var(--card));border-color:#7dd3fc}
.fruits.eau .fr button.on{border-color:#7dd3fc}
.wbar{height:8px;border-radius:100px;background:var(--card2);overflow:hidden}
.wbar div{height:100%;border-radius:100px;background:linear-gradient(90deg,#38bdf8,#2563eb);transition:width .3s}
/* Boussole Qibla */
.qbtn{position:absolute;top:14px;right:14px;border:none;background:rgba(255,255,255,.22);color:#fff;border-radius:100px;padding:6px 11px;font-weight:800;font-size:.74rem;cursor:pointer}
.compass{position:relative;width:min(270px,76vw);aspect-ratio:1;margin:22px auto 14px}
.dial{position:absolute;inset:0;border-radius:50%;border:2px solid var(--line);box-shadow:var(--sh);
  background:radial-gradient(circle,var(--card) 0 60%,var(--card2) 61% 100%)}
.dial .cp{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;display:grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--muted)}
.dial .cp.n{color:#ef4444}
.dial .tk{position:absolute;left:50%;top:0;width:2px;height:9px;margin-left:-1px;background:var(--line);transform-origin:50% calc(min(270px,76vw)/2)}
.dial .ql{position:absolute;left:50%;bottom:50%;width:6px;margin-left:-3px;height:38%;border-radius:6px;background:linear-gradient(0deg,rgba(16,185,129,.15),#10b981);transform-origin:50% 100%}
.dial .kb{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;display:grid;place-items:center;font-size:1.8rem}
.needle{position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:18px solid var(--indigo);z-index:2}
.compass.ok .needle{border-top-color:#10b981}
.compass.ok .dial{border-color:#10b981;box-shadow:0 0 0 6px rgba(16,185,129,.18)}
.qcenter{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.qcenter b{display:block;font-size:1.6rem;font-weight:800}
.qcenter small{font-size:.72rem;color:var(--muted);font-weight:700}

/* Listes à cocher */
.checks{display:flex;flex-direction:column;gap:7px}
.ck{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;background:var(--card);text-align:left;font-size:.86rem;font-weight:700;width:100%}
.ck .box{width:24px;height:24px;border-radius:8px;border:2px solid #c7d2fe;flex:none;display:grid;place-items:center;font-size:.8rem;color:#fff}
.ck.on{background:color-mix(in srgb,var(--emerald) 10%,var(--card));border-color:#a7f3d0}
.ck.on .box{background:linear-gradient(135deg,#10b981,#059669);border-color:transparent}
.ck.on .box::before{content:"✓"}
.prio{display:flex;gap:8px;align-items:center}
.prio input[type=text]{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card2);border-radius:12px;padding:11px 12px;font-size:.88rem;font-weight:600}
.prio .ck{width:auto;padding:9px}
.prio .ck.on{opacity:1}

/* Citations */
.quote{border-radius:var(--r);padding:20px;color:#fff;box-shadow:0 12px 28px rgba(124,58,237,.2)}
.quote .q-tag{display:inline-block;background:rgba(255,255,255,.22);border-radius:100px;padding:3px 10px;font-size:.7rem;font-weight:800;margin-bottom:10px}
.quote p{font-size:1.05rem;font-weight:700;line-height:1.45}
.quote .ar{font-family:'Amiri',serif;font-size:1.35rem;direction:rtl;text-align:right;margin-bottom:8px;line-height:1.7}
.quote .src{margin-top:10px;font-size:.78rem;font-weight:700;opacity:.9;display:flex;align-items:center;gap:8px}
.quote .src button{margin-left:auto;border:none;background:rgba(255,255,255,.22);color:#fff;border-radius:100px;padding:5px 11px;font-weight:800;font-size:.72rem;cursor:pointer}

/* Boutons */
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:800;font-size:.85rem;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--violet);color:var(--violet)}
.btn.pri{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-color:transparent}
.btn.green{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-color:transparent}
.btn.sm{padding:7px 11px;font-size:.78rem;border-radius:10px}
textarea,.inp{width:100%;border:1.5px solid var(--line);background:var(--card2);border-radius:12px;padding:11px 12px;font-size:.9rem;font-weight:600;resize:vertical}
textarea:focus,.inp:focus,.prio input:focus{outline:none;border-color:var(--violet)}
label.f{display:block;font-size:.78rem;font-weight:800;color:var(--muted);margin:10px 0 5px}

/* Prières (onglet Dîn) */
.prayer{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.prayer.cur{border-color:var(--emerald);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.prayer .nm b{font-size:1rem;font-weight:800}
.prayer .nm .arn{font-family:'Amiri',serif;color:var(--muted);margin-left:6px}
.prayer .nm small{display:block;color:var(--muted);font-weight:600;font-size:.76rem}
.prayer .hr{font-size:1.15rem;font-weight:800;text-align:right}
.seg{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.seg button{border:1.5px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 2px;font-size:.72rem;font-weight:800;cursor:pointer}
.seg button.on.s-heure{background:#10b981;color:#fff;border-color:transparent}
.seg button.on.s-mosquee{background:#0ea5e9;color:#fff;border-color:transparent}
.seg button.on.s-retard{background:#f59e0b;color:#fff;border-color:transparent}
.seg button.on.s-manquee{background:#ef4444;color:#fff;border-color:transparent}

/* Compteur dhikr */
.dhikr{display:flex;align-items:center;gap:12px}
.dhikr .big{font-size:2rem;font-weight:800;min-width:70px}
.dhikr button{border:none;border-radius:14px;padding:12px 14px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#14b8a6,#0ea5e9);color:#fff;font-size:.9rem}

/* Graphiques */
.chart{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:8px;position:relative}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .b{width:100%;border-radius:5px 5px 2px 2px;min-height:2px}
.chart .x{font-size:.58rem;color:var(--muted);font-weight:700;margin-top:4px;white-space:nowrap}
.chart .tgt{position:absolute;left:0;right:0;border-top:2px dashed #f43f5e;pointer-events:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);font-weight:700;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Calendrier */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .hd{font-size:.66rem;color:var(--muted);font-weight:800;text-align:center}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:.75rem;font-weight:800;cursor:pointer;border:1.5px solid transparent;background:var(--card2)}
.cal .d.sel{border-color:var(--ink)}
.cal .d.fut{opacity:.35;cursor:default}

/* Tableaux */
.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.86rem;font-weight:700;gap:10px}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--muted);font-weight:600}
.dom{display:grid;grid-template-columns:110px 1fr 46px 40px;gap:8px;align-items:center;font-size:.82rem;font-weight:700;margin:7px 0}
.dom .tr{height:10px;background:var(--card2);border-radius:100px;overflow:hidden}
.dom .tr div{height:100%;border-radius:100px}
.up{color:#059669}.down{color:#e11d48}

/* Tabac */
.plan{display:flex;flex-direction:column;gap:6px}
.plan .wk{display:grid;grid-template-columns:88px 1fr auto;gap:8px;align-items:center;font-size:.8rem;font-weight:700;padding:8px 10px;border-radius:12px;background:var(--card2)}
.plan .wk.now{background:linear-gradient(135deg,#f59e0b,#fb7185);color:#fff}
.coach{border-radius:16px;padding:14px;background:color-mix(in srgb,var(--amber) 12%,var(--card));border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);font-size:.88rem;font-weight:700;line-height:1.45}

/* Fenêtre / toast */
.sheet-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:24px}}

const _fmtTz={};

const MIN_PAR_CIG=20;
function vieGagnee(n){
  const m=Math.round(n*MIN_PAR_CIG); if(m<60) return m+' min';
  const j=Math.floor(m/1440), h=Math.floor(m%1440/60), mi=m%60;
  return j?`${j} j ${h} h`:`${h} h${mi?' '+String(mi).padStart(2,'0'):''}`;
}

const _tcache={};
function timesOf(k){
  const P=S.cfg.priere||{}, L=S.cfg.lieu||{};
  if(P.methode!=='hsc' && L.lat!=null && window.adhan){
    const tz=lieuTz(), ck=k+'|'+P.methode+'|'+L.lat+'|'+L.lon+'|'+tz; if(_tcache[ck]) return _tcache[ck];
    try{
      const M=METHODES[P.methode]||METHODES.uoif, c=new adhan.Coordinates(L.lat,L.lon);
      const pr=new adhan.CalculationParameters('Other',M.f,M.i); pr.madhab=adhan.Madhab.Shafi; pr.highLatitudeRule=adhan.HighLatitudeRule.recommended(c);
      const t=new adhan.PrayerTimes(c,dateOf(k),pr), mn=x=>Math.floor(minIn(x,tz)+1e-6);
      return _tcache[ck]=[mn(t.fajr),mn(t.sunrise),mn(t.dhuhr),mn(t.asr),mn(t.maghrib),mn(t.isha)];
    }catch(e){}
  }
  const d=dateOf(k);
  let row=(CAL[d.getMonth()]||'').split('|')[d.getDate()-1];
  if(!row) row=CAL[d.getMonth()].split('|').pop();
  const t=[]; for(let i=0;i<6;i++) t.push(Number(row.substr(i*4,2))*60+Number(row.substr(i*4+2,2)));
  return t; // minutes : fajr, chourouq, dhuhr, asr, maghrib, isha
}

    if(r.maintenant){ try{ localStorage.setItem(kD,r.maintenant); if(complet) localStorage.setItem(kC,String(Date.now())); }catch(e){} }
    saveLocal(); setSync('ok');

  pulling=false;
}

const cigN=k=>has(k)?(S.jours[k].cig||[]).length:null;
function prixCig(){ return S.cfg.tabac.prix/20; }
function weekIdx(k){ const d=S.cfg.tabac.debut; if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d)) return -1; const w=Math.floor(diffDays(d,k)/7); return isNaN(w)?-1:w; }
function weekAvg(w){
  const s=addDays(S.cfg.tabac.debut,w*7); let tot=0,n=0;
  for(let i=0;i<7;i++){ const k=addDays(s,i); const c=cigN(k); if(c!==null && k<today()){ tot+=c; n++; } else if(c!==null && k===today()){ /* journée en cours : ignorée */ } }
  return n?tot/n:null;
}
// Objectif de chaque semaine : on baisse de « pas » si la semaine précédente a tenu l'objectif (+1 de tolérance), sinon on garde le palier
function planTargets(nbWeeks){
  const T=S.cfg.tabac, out=[]; let t=T.base;
  const wNow=weekIdx(today());
  for(let w=0; w<nbWeeks; w++){
    if(w===0) t=Math.max(0,T.base-T.pas);
    else{
      const a = w<=wNow ? weekAvg(w-1) : null;
      const prev=out[w-1].t;
      if(w<=wNow && a!==null && a>prev+1){ t=prev; out[w-1].tenu=false; }
      else{ t=Math.max(0,prev-T.pas); if(w<=wNow && a!==null) out[w-1].tenu=true; }
    }
    out.push({w, t, debut:addDays(T.debut,w*7), avg:w<=wNow?weekAvg(w):null, futur:w>wNow});
  }
  return out;
}
function targetOf(k){
  const w=weekIdx(k); if(w<0) return S.cfg.tabac.base;
  const p=planTargets(w+1); return p[w].t;
}
function firstCigLimit(k){
  const w=Math.max(0,weekIdx(k)); return Math.min(toMin(S.cfg.tabac.premiereBase)+w*S.cfg.tabac.premierePas, 12*60);
}
function arretPrevu(){
  const p=planTargets(60); const z=p.find(x=>x.t===0); return z?z.debut:null;
}
function tabacStats(){
  const T=S.cfg.tabac, t=today(); let evitees=0, jours=0;
  if(weekIdx(t)<0) return {evitees:0, eco:0, jours:0, sans:0};
  for(let k=T.debut; k<t; k=addDays(k,1)){ const c=cigN(k); if(c!==null){ evitees+=Math.max(0,T.base-c); jours++; } } // journées terminées seulement
  let sans=0; for(let k=t; k>=T.debut; k=addDays(k,-1)){ const c=cigN(k); if(c===0) sans++; else if(k===t && c===null) continue; else break; }
  return {evitees, eco:evitees*prixCig(), jours, sans};
}
function avgCig(n,fromK){ let tot=0,c=0; for(let i=1;i<=n;i++){ const k=addDays(fromK||today(),-i); const v=cigN(k); if(v!==null){ tot+=v; c++; } } return c?tot/c:null; }

function scoreOf(k){
  const d=J(k), W=S.cfg.poids, parts=[];
  const pv=PRAYERS.reduce((s,p)=>s+((PSTAT.find(x=>x.k===d.p[p.k])||{v:0}).v),0)/5;
  parts.push({k:'prieres',l:'Prières',f:pv,txt:`${PRAYERS.filter(p=>['heure','mosquee','retard'].includes(d.p[p.k])).length}/5`});
  const n=d.cig.length, t=targetOf(k);
  const tv = k<S.cfg.tabac.debut ? 0 : (n<=t?1:Math.max(0,1-(n-t)/5));
  if(S.cfg.fumeur) parts.push({k:'tabac',l:'Tabac',f:tv,txt:`${n}/${t}`});
  const ne=essFaits(d); parts.push({k:'essentiels',l:'Mes essentiels',f:ne/6,txt:`${ne}/6`}); // 6 cases au choix, même poids chacune
  const nb=baNb(d);
  parts.push({k:'bonnes',l:'Bonnes actions',f:nb>=1?1:0,txt:nb?`${nb} ✓`:'—'}); // une seule bonne action suffit, les autres sont du bonus
  parts.push({k:'fruits',l:'Fruits',f:Math.min(5,d.fruits||0)/5,txt:`${d.fruits||0}/5`});
  parts.push({k:'eau',l:'Eau',f:Math.min(6,d.eau||0)/6,txt:`${litres(d.eau)} L`});
  const pr=d.prio.filter(p=>p.t.trim()), po=pr.filter(p=>p.ok).length;
  parts.push({k:'business',l:'Business',f:pr.length?po/pr.length:0,txt:`${po}/${pr.length||3}`});
  let tot=0,max=0; parts.forEach(p=>{ p.max=p.k==='essentiels'?(W.essentiels??((+W.sport||0)+(+W.coran||0)+(+W.lecture||0)+(+W.famille||0))):(W[p.k]||0); p.pts=Math.round(p.f*p.max*10)/10; tot+=p.f*p.max; max+=p.max; });
  let score=max?Math.round(tot/max*100):0;
  // Bonus jeûne : +10 points (jeûne surérogatoire ou jour de Ramadan jeûné), sans pénaliser les jours sans jeûne
  if(d.jeuneNafl||d.jeune==='fait'){ parts.push({k:'jeune',l:'Jeûne',bonus:true,f:1,pts:10,max:0,txt:d.jeune==='fait'?'Ramadan':'surérogatoire'}); score=Math.min(100,score+10); }
  return {score, parts};
}

function prayerReg(n){
  const r={heure:0,retard:0,manque:0}; let days=0; PRAYERS.forEach(p=>r[p.k]=0);
  for(let i=0;i<n;i++){ const k=addDays(today(),-i); if(k<firstDay()) break; days++; const d=(S.jours[k]||{}).p||{};
    PRAYERS.forEach(p=>{ const s=d[p.k]; if(s==='heure'||s==='mosquee'){ r[p.k]++; r.heure++; } else if(s==='retard'){ r[p.k]++; r.retard++; } else if(i>0||s==='manquee') r.manque++; }); }
  PRAYERS.forEach(p=>r[p.k]=days?Math.round(r[p.k]/days*100):0);
  r.heure=days?Math.round(r.heure/(days*5)*100):0; return r;
}

function coachMsg(){
  const d=J(today()), n=d.cig.length, t=targetOf(today());
  const now=new Date(), m=now.getHours()*60+now.getMinutes(), lim=firstCigLimit(today());
  const last=d.cig.length?d.cig[d.cig.length-1]:null;
  const ago=last?Math.round((Date.now()-last)/60000):null;
  if(today()<S.cfg.tabac.debut) return `Le programme démarre le ${esc(fmtLong(S.cfg.tabac.debut))}. Prépare-toi.`;
  if(t===0) return n===0?'Objectif zéro : chaque heure sans cigarette est une victoire. Ton corps se répare déjà.':'Ce n\'est pas un échec, c\'est une information. Note ce qui a déclenché l\'envie et reprends tout de suite.';
  if(!n && m<lim) return `Pas encore fumé, bravo. Tiens jusqu'à <b>${hm(lim)}</b> pour la première : bois de l'eau, fais tes adhkar, va au sport.`;
  if(n>=t) return `Tu as atteint ton maximum du jour (${t}). Chaque cigarette en moins maintenant, c'est ${prixCig().toFixed(2).replace('.',',')} € et quelques minutes de vie gagnés. Utilise le bouton « envie ».`;
  const restH=Math.max(1,(23*60-m)/60), per=(t-n)/restH;
  return `Il te reste <b>${t-n}</b> cigarette${t-n>1?'s':''} pour la journée${ago!==null?`, la dernière date de ${ago<60?ago+' min':Math.floor(ago/60)+' h '+pad(ago%60)}`:''}. Espace-les : environ une toutes les ${Math.round(60/Math.max(per,.01))} min au maximum.`;
}

function toast(msg,ms){ const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),ms||2200); }
function vib(){ try{ navigator.vibrate&&navigator.vibrate(12); }catch(e){} }
function toggle(k){
  const d=J(); d[k]=!d[k]; if(k==='sport'&&d.sport) d.repos=false; vib(); touch(); render();
  if(d[k]) toast({sport:'💪 Séance validée !',coran:'📖 BarakAllahu fik',lecture:'📚 +20 min pour ton cerveau',famille:'❤️ Le meilleur investissement',adhM:'☀️ Protégé pour la journée',adhS:'🌙 Protégé pour la nuit',repos:'😴 Repos noté',jeuneNafl:'🍽️ Qu\'Allah accepte ton jeûne · +10 points',aime:'🤍 Qu\'Allah t\'aime et t\'accepte'}[k]||'✓');
}
function cyclePrayer(p){ const order=[undefined,'heure','retard','manquee']; const d=J(); const i=order.indexOf(d.p[p]); setPrayer(p,order[(i+1)%order.length]||null,true); }
function setPrayer(p,s,cyc){ const d=J(); d.p[p]=(!cyc&&d.p[p]===s)?null:s; if(!d.p[p]) delete d.p[p]; vib(); touch(); render();
  if(d.p[p]==='heure'||d.p[p]==='mosquee') toast(prayCount(S.sel)===5?'🌟 5/5 prières, mashaAllah !':'🕌 Prière notée'); }
function cig(n){
  const d=J();
  if(n>0){
    const isT=S.sel===today(); const now=new Date(); const m=now.getHours()*60+now.getMinutes();
    if(isT && !d.cig.length && m<firstCigLimit(S.sel) && S.sel>=S.cfg.tabac.debut){ return sheetFirst(); }
    addCig();
  } else if(d.cig.length){ d.cig.pop(); touch(); render(); toast('Cigarette retirée'); }
}

  const d=J(); const isT=S.sel===today();

function authErr(m){
  if(/Invalid login/i.test(m)) return 'E-mail ou mot de passe incorrect';
  if(/already registered|already exists/i.test(m)) return 'Ce compte existe déjà : choisis « J\'ai un compte »';
  if(/rate|limit|seconds/i.test(m)) return 'Trop de tentatives : réessaie dans quelques minutes';
  if(/Password should|weak/i.test(m)) return 'Mot de passe trop faible (8 caractères minimum)';
  return 'Erreur : '+m;
}
async function authOk(){
  const e=(document.getElementById('authEmail').value||'').trim().toLowerCase(), pw=document.getElementById('authPass').value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return toast('Adresse e-mail invalide');
  if(S.authStep==='signup' && pw.length<8) return toast('Mot de passe : 8 caractères minimum');
  const b=document.getElementById('authBtn'); b.disabled=true; b.textContent='Un instant…'; S.authEmail=e;
  const r = S.authStep==='signup' ? await sb.auth.signUp({email:e,password:pw}) : await sb.auth.signInWithPassword({email:e,password:pw});
  if(r.error){ b.disabled=false; b.textContent=S.authStep==='signup'?'Créer mon compte':'Se connecter'; return toast(authErr(r.error.message),4000); }
  if(!r.data.session){ b.disabled=false; S.authStep='login'; render(); return toast('Compte créé : confirme ton adresse via l\'e-mail reçu, puis connecte-toi',6000); }
  demarrer(r.data.user);
}
async function envoyerReset(){
  const e=(document.getElementById('authEmail').value||'').trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return toast('Adresse e-mail invalide');
  const b=document.getElementById('authBtn'); b.disabled=true;
  const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});
  b.disabled=false; if(error) return toast(authErr(error.message),4000);

}
async function nouveauPass(){

  S.jours=lsGet(LS.jours,{}); S.cfg=merge(DEF_CFG,lsGet(LS.cfg,{}));
  S.dirty=new Set(lsGet(LS.dirty,[])||[]); S.cfgDirty=false;
  S.view=(lsGet(LS.ui,{}).view)||'jour'; S.sel=today();
  S.pret=!!S.cfg.onb; S.sync='wait';

}

async function importAncien(cle){

    if(!r.ok) throw new Error('lien refusé'); const o=await r.json(); let n=0;
    for(const [k,d] of Object.entries(o.jours||{})){ if(!S.jours[k]||(d.u||0)>(S.jours[k].u||0)){ S.jours[k]=d; S.dirty.add(k); n++; } }
    // Réglages utiles de l'ancienne version (sans écraser le prénom ni la ville déjà choisis)
    const c=o.config||{}; let nr=0;
    if(c.tabac){ S.cfg.tabac=Object.assign({},S.cfg.tabac,c.tabac); S.cfg.fumeur=true; nr++; }

    if(nr) cfgTouch();
    saveLocal(); try{ localStorage.removeItem('nya_import'); }catch(e){} try{ await push(); }catch(e){ planPush(); } render(); toast(`📂 ${n} journée${n>1?'s':''} importée${n>1?'s':''}${nr?' + tes réglages (tabac, poids, mosquée An-Nour…)':''}`,4500);
  }catch(e){ toast('Import impossible : '+esc(e.message),4000); }
}

function chercherVille(q){

    const monde=fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=fr&format=json&name='+qq).then(r=>r.json()).then(o=>(o.results||[]).filter(x=>x.country_code!=='FR').map(x=>({nom:x.name+', '+(x.country||''), info:[x.admin1,x.country].filter(Boolean).join(' · '), lat:x.latitude, lon:x.longitude, tz:x.timezone||''}))).catch(()=>[]);

/* =====================================================================
   Boussole Qibla : position GPS → direction de la Kaaba, boussole du téléphone
   ===================================================================== */
const KAABA=[21.422487,39.826206];
const Q={pos:null,heading:null,on:false,ok:false,src:''};
const rad=x=>x*Math.PI/180, deg=x=>x*180/Math.PI;
function qiblaBearing(lat,lon){
  const p1=rad(lat), p2=rad(KAABA[0]), dl=rad(KAABA[1]-lon);
  return (deg(Math.atan2(Math.sin(dl)*Math.cos(p2), Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl)))+360)%360;
}
function distKaaba(lat,lon){
  const a=Math.sin(rad(KAABA[0]-lat)/2)**2+Math.cos(rad(lat))*Math.cos(rad(KAABA[0]))*Math.sin(rad(KAABA[1]-lon)/2)**2;
  return 6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
const POINTS=['nord','nord-est','est','sud-est','sud','sud-ouest','ouest','nord-ouest'];
const cardinal=b=>POINTS[Math.round(b/45)%8];
function qiblaHtml(inSheet){
  const ticks=Array.from({length:36},(_,i)=>`<div class="tk" style="transform:rotate(${i*10}deg);${i%9===0?'height:14px;background:var(--muted)':''}"></div>`).join('');
  const cp=[['N',0,'n'],['E',90,''],['S',180,''],['O',270,'']].map(([l,a,c])=>`<div class="cp ${c}" style="transform:rotate(${a}deg) translateY(calc(min(270px,76vw)/-2 + 30px)) rotate(${-a}deg)">${l}</div>`).join('');
  return `<h3 style="font-size:1.15rem;font-weight:800;margin-bottom:6px">🧭 Direction de la Qibla</h3>
    <p class="muted" style="font-size:.84rem;font-weight:600">Tiens ton téléphone à plat, loin d'un objet métallique, et tourne-toi jusqu'à ce que la flèche verte et 🕋 soient sous le triangle du haut.</p>
    <div class="compass" id="qComp"><div class="needle"></div>
      <div class="dial" id="qDial">${ticks}${cp}<div class="ql" id="qLine"></div><div class="kb" id="qKb">🕋</div></div>
      <div class="qcenter"><div><b id="qDeg">…</b><small id="qHint">Localisation…</small></div></div></div>
    <div class="coach" id="qInfo">Recherche de ta position…</div>
    <div class="row mt" style="flex-wrap:wrap"><button class="btn pri" id="qStart" onclick="startCompass()">${Q.on?'✅ Boussole active':'📱 Activer la boussole'}</button>${inSheet?'<button class="btn" onclick="closeSheet()">Fermer</button>':''}</div>`;
}
function openQibla(){ go('qibla'); }
function vQibla(){ setTimeout(()=>{ Q.ok=false; locate(); },0); return `<div class="panel">${qiblaHtml(false)}</div>`; }
function locate(){
  const done=(lat,lon,src)=>{ Q.pos={lat,lon}; Q.src=src; lsSet('nya_pos',{lat,lon,t:Date.now()}); updQ(); };
  const last=lsGet('nya_pos',null);
  if(last) { Q.pos={lat:last.lat,lon:last.lon}; Q.src='dernière position connue'; updQ(); }
  const L=S.cfg.lieu||{}, fb=L.lat!=null?[L.lat,L.lon,(L.nom||'ta ville')+' (réglages)']:[21.4225,39.8262,'position inconnue'];
  if(!navigator.geolocation){ if(!last) done(fb[0],fb[1],fb[2]); return; }
  navigator.geolocation.getCurrentPosition(p=>done(p.coords.latitude,p.coords.longitude,'ta position actuelle'),
    ()=>{ if(!last){ Q.pos={lat:fb[0],lon:fb[1]}; Q.src=fb[2]+' — localisation refusée'; updQ(); } },
    {enableHighAccuracy:false,timeout:12000,maximumAge:300000});
}
async function startCompass(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted'){ qInfo('Autorise l\'accès « Mouvement et orientation » pour utiliser la boussole.'); return; }
    }
  }catch(e){ qInfo('Impossible d\'activer la boussole : '+esc(e.message||e)); return; }
  if(!Q.on){ window.addEventListener('deviceorientationabsolute',onOri,true); window.addEventListener('deviceorientation',onOri,true); Q.on=true; }
  const b=document.getElementById('qStart'); if(b) b.textContent='✅ Boussole active';
  setTimeout(()=>{ if(Q.on && Q.heading===null) qInfo(`Pas de boussole sur cet appareil (ordinateur ?). La Qibla est à <b>${Math.round(qiblaBearing(Q.pos.lat,Q.pos.lon))}°</b> depuis le nord, vers le <b>${cardinal(qiblaBearing(Q.pos.lat,Q.pos.lon))}</b>.`); },2500);
}
function stopCompass(){ if(!Q.on) return; window.removeEventListener('deviceorientationabsolute',onOri,true); window.removeEventListener('deviceorientation',onOri,true); Q.on=false; }
function onOri(e){
  let h=null;
  if(typeof e.webkitCompassHeading==='number') h=e.webkitCompassHeading;            // iPhone
  else if(e.absolute && typeof e.alpha==='number') h=(360-e.alpha)%360;              // Android
  if(h===null) return;
  h=(h+((screen.orientation&&screen.orientation.angle)||window.orientation||0)+360)%360;
  if(Q.heading===null) Q.heading=h; else { const d=((h-Q.heading+540)%360)-180; Q.heading=(Q.heading+d*.35+360)%360; }
  updQ();
}
function qInfo(h){ const el=document.getElementById('qInfo'); if(el) el.innerHTML=h; }
function updQ(){
  const dial=document.getElementById('qDial'); if(!dial||!Q.pos) return;
  const b=qiblaBearing(Q.pos.lat,Q.pos.lon), km=Math.round(distKaaba(Q.pos.lat,Q.pos.lon));
  const R='calc(min(270px,76vw)/-2 + 62px)';
  document.getElementById('qLine').style.transform=`rotate(${b}deg)`;
  document.getElementById('qKb').style.transform=`rotate(${b}deg) translateY(${R}) rotate(${-b}deg)`;
  const head=Q.heading??0;
  dial.style.transform=`rotate(${-head}deg)`;
  const diff=((b-head+540)%360)-180, ok=Q.heading!==null && Math.abs(diff)<=5;
  document.getElementById('qComp').classList.toggle('ok',ok);
  if(ok && !Q.ok) vib(); Q.ok=ok;
  if(Q.heading===null){ document.getElementById('qDeg').textContent=Math.round(b)+'°'; document.getElementById('qHint').textContent='vers le '+cardinal(b); }
  else{ document.getElementById('qDeg').textContent=ok?'🕋':Math.abs(Math.round(diff))+'°';
    document.getElementById('qHint').textContent=ok?'Tu es face à la Qibla':(diff>0?'tourne à droite ↻':'tourne à gauche ↺'); }
  qInfo(`📍 ${esc(Q.src)} · La Mecque à <b>${km.toLocaleString('fr-FR')} km</b>, direction <b>${Math.round(b)}°</b> (${cardinal(b)}).${ok?'<br>✅ <b>Tu es bien orienté, qu\'Allah accepte ta prière.</b>':''}`);
}

async function chargerSourate(n){
  const url=QURL(n); let r=null, c=null;
  try{ if('caches' in window){ c=await caches.open('niyya-coran-v1'); r=await c.match(url); } }catch(e){}
  if(!r){ r=await fetch(url); if(!r.ok) throw new Error('serveur indisponible'); try{ if(c) await c.put(url,r.clone()); }catch(e){} }
  const j=await r.json(); const [A,F]=j.data;
  const ar=A.ayahs.map((a,i)=>{ let t=a.text.replace(/^\uFEFF/,''); if(n!==1 && i===0){ const w=t.split(/\s+/); if(w.length>4 && w[0].startsWith('بِسْمِ')) t=w.slice(4).join(' '); } return t; });
  return { ar, fr:F.ayahs.map(a=>a.text) };
}
function ouvrirSourate(n,verset){
  QC.n=n; QC.data=null; QC.err=null; QC.goto=verset||null; render(); window.scrollTo({top:0});

}

/* ---------- Bonnes actions du jour : 9 tirées de BA_POOL, toujours les mêmes pour une date donnée ---------- */
function baJour(k){
  const d=S.jours[k];
  if(d && Array.isArray(d.baIds) && d.baIds.length===9) return d.baIds;  // la liste vue ce jour-là reste figée
  if(d && d.u && !d.baIds && d.ba && d.ba.some(Boolean)) return [26,5,24,11,9,15,33,34,14]; // anciennes journées : équivalents des 9 actions fixes d'origine
  let seed=0; for(const c of k) seed=(seed*31+c.charCodeAt(0))>>>0;
  const idx=BA_POOL.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ seed=(seed*1103515245+12345)>>>0; const j=seed%(i+1); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return idx.slice(0,9);
}
function baCat(k,cat){ const d=S.jours[k]; if(!d||!d.ba) return 0; const ids=baJour(k); return ids.some((id,i)=>d.ba[i]&&BA_POOL[id][2]===cat)?1:0; }

const SPORTS=[['mma','🥊','MMA'],['crossfit','🏋️','CrossFit'],['muscu','💪','Musculation'],['natation','🏊','Natation'],['course','🏃','Course à pied'],['futsal','⚽','Futsal'],['padel','🎾','Padel'],['tennis','🎾','Tennis'],['pilates','🧘','Pilates']];
// sports ajoutés à la main par l'utilisateur : gardés dans ses réglages (S.cfg.sportsPerso = [[clé, nom]])
const sportsListe=()=>SPORTS.concat((S.cfg.sportsPerso||[]).map(([k,l])=>[k,'⭐',l]));
const sportNom=k=>k==='autre'?'Autre':(sportsListe().find(x=>x[0]===k)||[,,k])[2];
let _sportSel=[];
function openSport(){
  const d=J(); _sportSel=[...(d.sports||[])];
  openSheet(`<h3>💪 Quel sport aujourd'hui ?</h3>
    <p class="muted" style="font-size:.84rem;font-weight:600;margin-bottom:12px">Coche une ou plusieurs disciplines, puis valide.</p>
    <div class="checks" id="sportList">${sportsListe().map(([k,i,l])=>`<button class="ck ${_sportSel.includes(k)?'on':''}" data-k="${k}" onclick="sportCoche('${k}',this)"><span class="box"></span>${i} ${esc(l)}</button>`).join('')}</div>
    <label class="f">✨ Autre sport (il sera gardé pour les prochaines fois)</label>
    <div class="row"><input class="inp" id="sportAutre" placeholder="Ex. Boxe, Vélo, Basket…" maxlength="30" onkeydown="if(event.key==='Enter')sportAjouter()"><button class="btn" style="white-space:nowrap;flex:none" onclick="sportAjouter()">+ Ajouter</button></div>
    <div class="row mt" style="flex-wrap:wrap">
      <button class="btn green" onclick="sportValider()">✓ Valider</button>
      ${d.sport?'<button class="btn" style="color:#be123c" onclick="_sportSel=[];sportValider()">Pas de sport aujourd\'hui</button>':''}
      <button class="btn" onclick="closeSheet()">Annuler</button>
    </div>`);
}
function sportAjouter(){
  const inp=document.getElementById('sportAutre'); const l=(inp.value||'').trim().replace(/\s+/g,' ');
  if(!l) return toast('Écris le nom du sport');
  const ex=sportsListe().find(x=>x[2].toLowerCase()===l.toLowerCase());
  const k=ex?ex[0]:'p_'+l.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').slice(0,24);
  if(!ex){ S.cfg.sportsPerso=[...(S.cfg.sportsPerso||[]),[k,l.charAt(0).toUpperCase()+l.slice(1)]]; cfgTouch(); }
  if(!_sportSel.includes(k)) _sportSel.push(k);
  const sel=[..._sportSel]; openSport(); _sportSel=sel;
  document.querySelectorAll('#sportList .ck').forEach(b=>b.classList.toggle('on',_sportSel.includes(b.dataset.k)));
  toast(ex?'Déjà dans la liste : coché':'⭐ '+l+' ajouté à ta liste');
}
function sportCoche(k,el){ const i=_sportSel.indexOf(k); if(i<0) _sportSel.push(k); else _sportSel.splice(i,1); el.classList.toggle('on'); vib(); }
function sportValider(){
  const d=J(); d.sports=[..._sportSel]; d.sport=d.sports.length>0; if(d.sport) d.repos=false;
  touch(); closeSheet(); render();
  if(d.sport) toast('💪 Séance validée : '+d.sports.map(sportNom).join(', '));
}

/* ---------- Statistiques ANONYMES d'ouverture des onglets (aucun identifiant stocké) ---------- */
const ADMIN_EMAIL='hestia14000@gmail.com';
function compter(onglet){
  if(!S.uid || !sb || location.hash==='#autotest') return;
  try{
    const k='nya_vu_'+onglet, t=Number(sessionStorage.getItem(k)||0);
    if(Date.now()-t < 10*60e3) return;              // une ouverture comptée au plus toutes les 10 min par onglet
    sessionStorage.setItem(k,String(Date.now()));
  }catch(e){}
  sb.rpc('niyya_compter',{p_onglet:onglet}).then(()=>{},()=>{});
}
function compterJournee(){ // 1 « actif » par appareil et par jour + mode d'ouverture (icône / navigateur)
  if(!S.uid || !sb || location.hash==='#autotest') return;
  try{
    const k='nya_actif_'+today(); if(localStorage.getItem(k)) return; localStorage.setItem(k,'1');
    const icone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
    if(icone && !S.cfg.vuIcone){ S.cfg.vuIcone=true; cfgTouch(); }
    sb.rpc('niyya_compter',{p_onglet:'actif'}).then(()=>{},()=>{});
    sb.rpc('niyya_compter',{p_onglet:icone?'lancement_appli':'lancement_web'}).then(()=>{},()=>{});
  }catch(e){}
}
let _stats=null;
async function chargerStats(){
  const el=document.getElementById('statsBox'); if(el) el.innerHTML='<p class="muted">Chargement…</p>';
  const {data,error}=await sb.rpc('niyya_stats_lire',{p_jours:30});

}
